[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "textquest-client"
version = "0.1.0"
description = "Python SDK for the TextQuest web API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "TextQuest Contributors" }
]
keywords = ["textquest", "sdk", "http", "websocket", "everquest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
  "aiohttp>=3.10,<4",
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.urls]
Documentation = "https://maleick.github.io/TextQuest/textquest-client/"
Homepage = "https://github.com/Maleick/TextQuest"
Issues = "https://github.com/Maleick/TextQuest/issues"

[tool.hatch.build.targets.wheel]
packages = ["textquest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
