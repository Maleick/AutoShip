[package]
name = "textquest-client"
version = "0.1.0"
edition = "2021"
description = "Rust client library for TextQuest web API"
authors = ["TextQuest Team <textquest@example.com>"]
license = "MIT"
repository = "https://github.com/anomalyco/TextQuest"
readme = "../../textquest-client/README.md"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.29", optional = true }
futures-util = "0.3"
thiserror = "2"
url = "2"

[features]
default = ["sync"]
sync = ["reqwest"]
async = ["tokio", "reqwest", "tokio-tungstenite", "futures-util"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
wiremock = "0.9"

[package.metadata.docs.rs]
all-features = true