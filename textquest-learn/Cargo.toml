[package]
name = "textquest-learn"
version = "0.6.0"
edition = "2021"
description = "Offline RL training harness for TextQuest policies (L-0 scaffold)"

[lib]
name = "textquest_learn"
path = "src/lib.rs"

[[bin]]
name = "textquest-learn"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2"
bincode = { version = "2", features = ["serde"] }
rand = "0.9"
siphasher = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3.8"

[features]
runtime-only = []

