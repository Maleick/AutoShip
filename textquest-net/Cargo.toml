[package]
name = "textquest-net"
version = "0.1.0"
edition = "2021"
description = "Cross-client communication transports: EQBC, DanNet, NetBots"

[dependencies]
textquest-common = { path = "../textquest-common" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
