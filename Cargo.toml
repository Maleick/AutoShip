[workspace]
members = [
    "textquest",
    "textquest-soul",
    "textquest-dll",
    "textquest-common",
    "textquest-web",
    "textquest-web-sdk",
    "tools/llm-client",
    "tools/eqdiff", "textquest-web-sdk",
]
resolver = "2"

# Shared dependencies — versions and base features declared once here.
# Crates reference these with `dependency.workspace = true` and may add
# extra features at the crate level without changing the shared version.
[workspace.dependencies]
anyhow = "1"
bincode = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
toml = "0.8"
toml_edit = "0.22"
regex = "1"

# Release profile for the injected DLL and orchestrator.
# `panic = "abort"` is critical for the cdylib: an unwinding panic from the DLL
# into eqgame.exe's stack frames would crash the game.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
