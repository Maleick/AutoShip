# Hold position while aggro active; the scout shelf has ramp geometry and
# social pockets — returning while hot causes bad pathing and wipes.
return_no_aggro = true

# Progression chain: Underfoot is the terminal tier for TextQuest scope.
prev_camp = "plane_of_innovation_primary"
