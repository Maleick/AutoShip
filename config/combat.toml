# Combat target scanner configuration.
# Controls how the TargetScanner ranks XTarget entries each decision tick.
#
# priority_order — ordered list of tiers; first matching tier wins for each mob.
# Valid values: "named", "low_aggro", "low_hp", "high_hp", "any"
#
# Thresholds are percentages [0.0, 100.0].

[target_scanner]
priority_order = ["named", "low_aggro", "low_hp", "high_hp", "any"]

# HP % below which a mob is considered "low HP".
low_hp_threshold_pct = 30.0

# HP % at or above which a mob is considered "high HP".
high_hp_threshold_pct = 80.0

# Aggro % below which a mob is considered "low aggro" (not focused on us).
low_aggro_threshold_pct = 50.0
