; =============================================================================
; EverQuest eqclient.ini — Multibox Resource Optimization Template
; =============================================================================
;
; PURPOSE: Minimize CPU / GPU / RAM per client for running 18-36 instances
; on a single machine (24-core, 64GB RAM).
;
; USAGE:
;   1. Back up your existing eqclient.ini
;   2. Copy desired settings into each client's eqclient.ini
;   3. Set eqclient.ini to read-only to prevent EQ from reverting settings
;   4. Make edits while EQ is NOT running
;
; NOTES:
;   - Settings marked [CRITICAL] have the biggest measurable impact
;   - Settings marked [HIGH] are strongly recommended
;   - Settings marked [MODERATE] provide incremental savings
;   - Settings marked [LOW] are minor but add up across 36 clients
;   - "Bot client" = background/non-interactive client
;   - "Driver client" = foreground/actively-played client
;
; SOURCES:
;   RedGuides multiboxing community, Almar's EQ Guides, Fanra's EQ Wiki,
;   Project 1999 Wiki, Steam Community EQ guides, eqfreelance forums
; =============================================================================


; =============================================================================
; [VideoMode] — Display Resolution
; =============================================================================
; Lower resolution = less GPU memory, less fill rate, less VRAM per client.
; Bot clients do not need high resolution since you never look at them.
;
; For 36 clients, use the smallest window you can get away with.
; The driver client can use higher resolution if desired.

[VideoMode]
; Bot client: tiny window (saves ~50-80MB VRAM per client vs 1080p)
WindowedWidth=640                       ; [CRITICAL] Windowed width in pixels
WindowedHeight=480                      ; [CRITICAL] Windowed height in pixels
Width=640                               ; Fullscreen width (unused in windowed)
Height=480                              ; Fullscreen height (unused in windowed)
FullscreenBitsPerPixel=16               ; [MODERATE] 16-bit color depth saves VRAM
FullscreenRefreshRate=0                 ; 0 = auto-detect
WindowedModeXOffset=0                   ; Window X position on screen
WindowedModeYOffset=0                   ; Window Y position on screen


; =============================================================================
; [Defaults] — Main Settings Section
; =============================================================================
; This is the largest section; controls graphics, sound, models, particles,
; lighting, and most performance-relevant settings.

[Defaults]

; ---------------------------------------------------------------------------
; AUDIO — Disable everything [CRITICAL]
; ---------------------------------------------------------------------------
; Sound is one of the biggest CPU/RAM savers. Each client's sound system
; consumes ~30-50MB RAM and measurable CPU. Disable on all bot clients.

Sound=FALSE                             ; [CRITICAL] Master sound toggle — saves CPU + ~30-50MB RAM
Music=0                                 ; [CRITICAL] Disable background music
CombatMusic=0                           ; [HIGH] Disable combat music
EnvSounds=0                             ; [HIGH] Disable environmental sounds (wind, water, etc.)
SoundVolume=0                           ; Volume to 0 (backup if Sound=FALSE fails)
Sound44k=0                              ; Use lower quality audio sampling
SpeakerType=0                           ; Simplest speaker config
MixAhead=0                              ; Reduce audio buffer (0 = minimum)

; ---------------------------------------------------------------------------
; DISPLAY MODE [CRITICAL]
; ---------------------------------------------------------------------------

WindowedMode=TRUE                       ; [CRITICAL] Must be windowed for multibox
AlwaysOnTop=0                           ; Do not force on top
Maximized=0                             ; Do not maximize
AllowResize=1                           ; Allow window resizing

; ---------------------------------------------------------------------------
; CHARACTER MODELS — Use Old Models or Stick Figures [CRITICAL]
; ---------------------------------------------------------------------------
; Luclin models consume significantly more RAM and GPU per client.
; Old models use ~40-60% less memory per character rendered.
; StickFigures mode is the ultimate savings — renders all PCs/NPCs as
; colored stick figures. Massive reduction in GPU/RAM.

StickFigures=0                          ; [CRITICAL] Set to 1 for MAXIMUM savings
                                        ; (renders all characters as stick figures)
                                        ; Reduces GPU + RAM dramatically
                                        ; Safe: this is an official EQ feature

AllLuclinPcModelsOff=TRUE               ; [CRITICAL] Disable all Luclin PC models
                                        ; Uses classic low-poly models instead
                                        ; Saves ~100-200MB RAM per client

; Per-race Luclin model toggles (all FALSE = use old models)
UseLuclinHumanMale=FALSE
UseLuclinHumanFemale=FALSE
UseLuclinBarbarianMale=FALSE
UseLuclinBarbarianFemale=FALSE
UseLuclinEruditeMale=FALSE
UseLuclinEruditeFemale=FALSE
UseLuclinWoodElfMale=FALSE
UseLuclinWoodElfFemale=FALSE
UseLuclinHighElfMale=FALSE
UseLuclinHighElfFemale=FALSE
UseLuclinDarkElfMale=FALSE
UseLuclinDarkElfFemale=FALSE
UseLuclinHalfElfMale=FALSE
UseLuclinHalfElfFemale=FALSE
UseLuclinDwarfMale=FALSE
UseLuclinDwarfFemale=FALSE
UseLuclinTrollMale=FALSE
UseLuclinTrollFemale=FALSE
UseLuclinOgreMale=FALSE
UseLuclinOgreFemale=FALSE
UseLuclinHalflingMale=FALSE
UseLuclinHalflingFemale=FALSE
UseLuclinGnomeMale=FALSE
UseLuclinGnomeFemale=FALSE
UseLuclinIksarMale=FALSE
UseLuclinIksarFemale=FALSE
UseLuclinVahShirMale=FALSE
UseLuclinVahShirFemale=FALSE
UseLuclinElementals=FALSE               ; Disable Luclin elemental models
LoadVeliousArmorsWithLuclin=FALSE       ; [MODERATE] Skip loading Velious armor textures
LoadArmor17=FALSE                       ; Skip optional armor sets
LoadArmor18=FALSE
LoadArmor19=FALSE
LoadArmor20=FALSE
LoadArmor21=FALSE
LoadArmor22=FALSE
LoadArmor23=FALSE
DisableTattoos=TRUE                     ; [LOW] Skip tattoo textures
LoadSocialAnimations=FALSE              ; [MODERATE] Skip emote animations — saves memory

; ---------------------------------------------------------------------------
; LIGHTING AND RENDERING [HIGH]
; ---------------------------------------------------------------------------

ShowDynamicLights=FALSE                 ; [HIGH] Disable torch/lightstone lighting effects
                                        ; Saves CPU per frame
MultiPassLighting=FALSE                 ; [HIGH] Disable multi-pass lighting
                                        ; Reduces draw calls significantly
UseLitBatches=FALSE                     ; [HIGH] Disable lit batch rendering
                                        ; Offloads work but on bot clients, skip entirely
DoProperTinting=FALSE                   ; [MODERATE] Skip proper color tinting calculations
Shadows=0                               ; [HIGH] Disable shadows completely
                                        ; Shadows are very expensive

; ---------------------------------------------------------------------------
; TEXTURES AND QUALITY [HIGH]
; ---------------------------------------------------------------------------

TextureQuality=0                        ; [HIGH] Lowest texture quality (0=lowest)
                                        ; Saves significant VRAM per client
MipMapping=FALSE                        ; [HIGH] Disable mipmapping
                                        ; Saves VRAM and reduces texture processing
TextureCache=FALSE                      ; [HIGH] Disable texture caching
                                        ; Reduces RAM usage per client
UseD3DTextureCompression=FALSE          ; [MODERATE] Disable D3D texture compression
                                        ; Avoid decompression CPU overhead
TerrainTextureQuality=0                 ; [MODERATE] Lowest terrain texture quality

; ---------------------------------------------------------------------------
; SHADERS [MODERATE — TRADE-OFF]
; ---------------------------------------------------------------------------
; Shaders offload work from CPU to GPU. With 36 clients sharing one GPU,
; disable shaders to reduce GPU contention. If GPU has headroom, enabling
; shaders can reduce CPU load.
;
; Recommendation for 36-box: DISABLE to reduce GPU memory and contention

VertexShaders=FALSE                     ; [MODERATE] Disable vertex shaders
20PixelShaders=FALSE                    ; [MODERATE] Disable pixel shaders (2.0)
14PixelShaders=FALSE                    ; [MODERATE] Disable pixel shaders (1.4)
1xPixelShaders=FALSE                    ; [MODERATE] Disable pixel shaders (1.x)
PostEffects=0                           ; [HIGH] Disable post-processing effects
                                        ; (bloom, color grading, screen tinting)
Bloom=0                                 ; [HIGH] Disable bloom lighting

; ---------------------------------------------------------------------------
; ENVIRONMENT AND WORLD RENDERING [HIGH]
; ---------------------------------------------------------------------------

ShowGrass=FALSE                         ; [HIGH] Disable grass rendering
                                        ; Grass is purely cosmetic, saves CPU+GPU
ShowSpellEffects=0                      ; [CRITICAL] Disable spell particle effects
                                        ; Spell particles are one of the biggest
                                        ; CPU/GPU drains in group/raid content
WaterSwap=0                             ; [MODERATE] Simplify water rendering
SkyUpdateInterval=60000                 ; [MODERATE] Update sky every 60 seconds
                                        ; instead of every frame
SkyCubemapSize=1                        ; [MODERATE] Smallest sky cubemap resolution

; ---------------------------------------------------------------------------
; PARTICLE EFFECTS — Disable ALL [CRITICAL]
; ---------------------------------------------------------------------------
; Particles are extremely expensive in group/raid scenarios.
; Zero these out on all bot clients.

SpellParticleOpacity=0.000000           ; [CRITICAL] Make spell particles invisible
EnvironmentParticleOpacity=0.000000     ; [CRITICAL] Make environment particles invisible
ActorParticleOpacity=0.000000           ; [CRITICAL] Make actor particles invisible
SpellParticleDensity=0.000000           ; [CRITICAL] Zero spell particle density
EnvironmentParticleDensity=0.000000     ; [CRITICAL] Zero environment particle density
ActorParticleDensity=0.000000           ; [CRITICAL] Zero actor particle density
SpellParticleNearClipPlane=999.000000   ; [HIGH] Push particle clip far away (effectively hidden)
EnvironmentParticleNearClipPlane=999.000000
ActorParticleNearClipPlane=999.000000
SpellParticleCastFilter=0              ; [HIGH] Filter out spell particle casting
EnvironmentParticleCastFilter=0
ActorParticleCastFilter=0

; ---------------------------------------------------------------------------
; PERFORMANCE / FPS CAPS [CRITICAL]
; ---------------------------------------------------------------------------
; EQ renders as fast as it can if uncapped. Capping FPS is essential
; for multiboxing to prevent any single client from hogging CPU/GPU.

MaxFPS=30                               ; [CRITICAL] Cap foreground FPS
                                        ; 30 is plenty for bot clients
                                        ; Driver client can use 60

; ---------------------------------------------------------------------------
; MISC PERFORMANCE [MODERATE]
; ---------------------------------------------------------------------------

Gamma=1                                 ; [LOW] Minimum gamma (fewer post-process ops)
ShowNamesLevel=1                        ; [LOW] Minimal name rendering (1=group only)
Log=FALSE                               ; [MODERATE] Disable chat logging (reduces disk I/O)
ServerFilter=1                          ; [MODERATE] Enable server-side message filtering
                                        ; Reduces network traffic + client processing
NetStat=FALSE                           ; [LOW] Disable network statistics display
ShowCreationHelp=FALSE                  ; [LOW] Skip help overlays
AutojoinHelp=0                          ; [LOW] Do not auto-join help channel
SendSystemInfo=0                        ; [LOW] Do not send system info
SystemInfoDelay=0
ShowAlarmWindow=false                   ; [LOW] Hide alarm window
LeftClickTargetHelp=0                   ; [LOW] Disable targeting help overlay
AllowAutoDuck=0                         ; [LOW] Disable auto-duck
CharCreateRotateOn=0                    ; [LOW] Skip char-create rotation
InspectOthers=FALSE                     ; [LOW] Disable inspect (minor)
AttackOnAssist=TRUE                     ; Gameplay: auto-attack on /assist
ShowInspectMessage=FALSE                ; Suppress inspect messages
ScreenshotType=JPG                      ; [LOW] If screenshots taken, use JPG not BMP

; ---------------------------------------------------------------------------
; UI SETTINGS [LOW]
; ---------------------------------------------------------------------------
; Hide unnecessary windows to reduce UI rendering overhead

UseNewUIEngine=0                        ; [MODERATE] Disable new UI engine
                                        ; Reported to fix frame limiter issues
                                        ; and reduce UI rendering overhead
ChatFontSize=2                          ; Smaller font = less rendering
ChatLineSpacing=0                       ; No extra line spacing
LockWindows=TRUE                        ; Lock windows to prevent accidental moves
DefaultChannel=8                        ; Default to a quiet channel
UISkin=default                          ; Use default skin (simplest)
AtlasSkin=default


; =============================================================================
; [Options] — Gameplay, Camera, FPS, Clip Planes
; =============================================================================

[Options]

; ---------------------------------------------------------------------------
; FPS LIMITING [CRITICAL]
; ---------------------------------------------------------------------------
; MaxBGFPS is THE most impactful single setting for multiboxing.
; When a client is in the background, it should render as little as possible.
;
; WARNING: Do not go below ~10 for bot clients running macros/plugins.
; Too low and autofollow/casting/combat macros become unreliable.
; 0 = unlimited (BAD for multiboxing).

MaxFPS=30                               ; [CRITICAL] Foreground FPS cap
MaxBGFPS=10                             ; [CRITICAL] Background FPS cap
                                        ; 10 is reliable for macro execution
                                        ; Use 5-10 for bots, 20-30 for driver
NoFPSLimiter=0                          ; [CRITICAL] Keep FPS limiter ENABLED (set to 0)

; ---------------------------------------------------------------------------
; CLIP PLANES — Draw Distance [HIGH]
; ---------------------------------------------------------------------------
; Clip planes control how far the client renders geometry and actors.
; Lower = fewer objects drawn = less CPU+GPU per frame.
; Bot clients do not need to see far.

ClipPlane=5                             ; [HIGH] Minimum world geometry draw distance
                                        ; Range: 0-50+. Lower = less geometry rendered
ActorClipPlane=5                        ; [HIGH] Actor (PC/NPC model) draw distance
                                        ; Lower = fewer character models rendered
ShadowClipPlane=0                       ; [HIGH] Shadow draw distance (0 = no shadows)

; ---------------------------------------------------------------------------
; LEVEL OF DETAIL [HIGH]
; ---------------------------------------------------------------------------

LODBias=0                               ; [HIGH] Aggressively reduce LOD
                                        ; 0 = lowest detail, uses simplest meshes
LoD=1                                   ; [MODERATE] Enable LOD system
Realism=0                               ; [MODERATE] Minimum realism level
FogScale=0.500000                       ; [MODERATE] Reduce fog complexity

; ---------------------------------------------------------------------------
; SKY AND ENVIRONMENT [MODERATE]
; ---------------------------------------------------------------------------

Sky=0                                   ; [MODERATE] Disable sky rendering entirely
                                        ; Sky=0 skips skybox draw calls
LoadScreenMode=0                        ; [LOW] Simplest loading screen
ParticleDensity=0                       ; [HIGH] Overall particle density to minimum
SameResolution=1                        ; Keep same resolution across modes

; ---------------------------------------------------------------------------
; UI / GAMEPLAY [LOW]
; ---------------------------------------------------------------------------

PCNames=1                               ; Show player names (needed for targeting)
NPCNames=1                              ; Show NPC names (needed for targeting)
Show3dTargetIndicator=0                 ; [LOW] Disable 3D target ring
MouseWheelZoom=1                        ; Keep mouse wheel zoom functional
MouseRightHanded=1
Anonymous=0
Trade=2
GuildInvites=1

; ---------------------------------------------------------------------------
; COMBAT MESSAGE FILTERS [MODERATE]
; ---------------------------------------------------------------------------
; Filter unnecessary combat messages to reduce text processing overhead.
; Each filtered message type reduces CPU spent on chat window rendering.

PCSpells=0                              ; [MODERATE] Hide other PC spell messages
NPCSpells=0                             ; [MODERATE] Hide NPC spell messages
BardSongs=0                             ; [LOW] Hide bard song messages
CriticalSpells=0                        ; [LOW] Hide critical spell notifications
CriticalMelee=0                         ; [LOW] Hide critical melee notifications
SpellDamage=0                           ; [LOW] Hide spell damage numbers
HideDamageShield=0                      ; Keep for combat awareness
DotDamage=0                             ; [LOW] Hide DoT damage ticks
PetAttacks=0                            ; [LOW] Hide pet attack messages
PetMisses=0                             ; [LOW] Hide pet miss messages
FocusEffects=0                          ; [LOW] Hide focus effect messages
PetSpells=0                             ; [LOW] Hide pet spell messages
HealOverTimeSpells=0                    ; [LOW] Hide HoT messages
ItemSpeech=0                            ; [LOW] Hide item proc messages
Strikethrough=0                         ; [LOW] Hide strikethrough messages
Stun=0                                  ; [LOW] Hide stun messages
BardSongsOnPets=0                       ; [LOW] Hide bard songs on pets
SwarmPetDeath=0                         ; [LOW] Hide swarm pet death messages
MercenaryMessages=0                     ; [LOW] Hide mercenary messages
FellowshipChat=0                        ; [LOW] Disable fellowship chat

; Camera presets (minimal for bot clients)
Camera1_Distance=20
Camera1_DirHeading=192
Camera1_Heading=0
Camera1_Pitch=0
Camera1_Height=5
Camera1_Zoom=90
Camera1_Change=1


; =============================================================================
; [HitsMode] — Floating Combat Numbers
; =============================================================================
; Disable floating damage/heal numbers to reduce rendering overhead.

[HitsMode]
MyHitsMode=0                            ; [LOW] Disable "my hits" floating text
OtherHitsMeMode=0                       ; [LOW] Disable "hits on me" floating text
OtherHitsOtherMode=0                    ; [LOW] Disable "other hits" floating text


; =============================================================================
; CPU AFFINITY — [Defaults] section addendum
; =============================================================================
; These go in the [Defaults] section. Add one line per CPU core you have.
; Setting to -1 lets Windows manage core assignment across all clients.
; This is THE most important CPU setting for multiboxing.
;
; Without this, EQ locks each instance to core 0, causing massive contention.
;
; For a 24-core system, add 24 lines:
;
; CPUAffinity0=-1
; CPUAffinity1=-1
; CPUAffinity2=-1
; CPUAffinity3=-1
; CPUAffinity4=-1
; CPUAffinity5=-1
; CPUAffinity6=-1
; CPUAffinity7=-1
; CPUAffinity8=-1
; CPUAffinity9=-1
; CPUAffinity10=-1
; CPUAffinity11=-1
; CPUAffinity12=-1
; CPUAffinity13=-1
; CPUAffinity14=-1
; CPUAffinity15=-1
; CPUAffinity16=-1
; CPUAffinity17=-1
; CPUAffinity18=-1
; CPUAffinity19=-1
; CPUAffinity20=-1
; CPUAffinity21=-1
; CPUAffinity22=-1
; CPUAffinity23=-1
;
; NOTE: In newer EQ patches, CPUAffinity# was renamed to ClientCore#.
; If CPUAffinity does not work, use ClientCore0=-1, ClientCore1=-1, etc.
;
; These settings allow all 36 clients to spread across all 24 cores.


; =============================================================================
; SUMMARY OF IMPACT BY CATEGORY
; =============================================================================
;
; CATEGORY                  | ESTIMATED SAVINGS PER CLIENT
; --------------------------+------------------------------------------
; Sound=FALSE               | ~30-50MB RAM, ~2-3% CPU
; AllLuclinPcModelsOff=TRUE | ~100-200MB RAM, reduced GPU
; StickFigures=1            | Massive GPU+RAM (renders wireframes only)
; MaxBGFPS=10               | ~60-80% GPU reduction when backgrounded
; All particles=0           | ~5-15% CPU in group/raid content
; CPUAffinity=-1            | Eliminates core-0 contention bottleneck
; Shadows=0                 | ~5-10% GPU per client
; ShowGrass=FALSE           | ~2-5% GPU
; MipMapping=FALSE          | ~20-50MB VRAM per client
; TextureQuality=0          | ~50-100MB VRAM per client
; ClipPlane=5               | ~10-20% GPU (fewer draw calls)
; ShowDynamicLights=FALSE   | ~2-5% CPU per frame
; Resolution 640x480        | ~50-80MB VRAM vs 1080p
; ServerFilter=1            | Reduced network + CPU processing
; PostEffects=0 + Bloom=0   | ~3-5% GPU
; Combat message filters    | ~1-2% CPU in heavy combat
;
; TOTAL ESTIMATED per bot client:
;   RAM:  ~400-600MB (down from ~1.2-1.5GB with defaults)
;   CPU:  ~2-4% per client (down from ~5-8%)
;   VRAM: ~80-150MB (down from ~200-400MB)
;
; For 36 clients at ~500MB each = ~18GB RAM
; With 64GB system RAM, leaves ~46GB for OS + orchestrator + headroom
;
;
; =============================================================================
; IN-GAME SETTINGS TO ALSO CONFIGURE
; =============================================================================
;
; These must be set in-game (not in INI) but are critical:
;
; 1. NPC Journal: Options > uncheck "Enable Journal"
;    - Records every NPC emote; massive CPU/RAM drain over time
;
; 2. Advanced Display > Clip Plane: set to ~75%
;    - Reduces geometry draw distance
;
; 3. Advanced Display > Particle settings: all to "Off"
;    - Supplements the INI particle settings
;
; 4. Options > Chat > uncheck unnecessary chat filters
;    - Reduces text rendering and processing
;
; 5. /showgrass off (in-game command)
;    - Confirms ShowGrass=FALSE from INI
;
; 6. Set eqclient.ini to READ-ONLY after configuring
;    - Prevents EQ from reverting your optimized settings
