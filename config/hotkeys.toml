# TextQuest Hotkey Configuration
#
# This file defines hotkeys for the TUI dashboard. Hotkeys can be:
# - Global (available to all characters)
# - Character-specific (available only to that character)
#
# Key Format:
#   - Single character: "a", "?", "@"
#   - Function keys: "F1", "F2", ..., "F12"
#   - Special keys: "Tab", "Enter", "Backspace", "Esc", "Left", "Right", "Up", "Down",
#                   "Home", "End", "PageUp", "PageDown", "Delete", "Insert"
#
# Modifiers:
#   - shift: bool (optional, default: false)
#   - alt: bool (optional, default: false)
#   - ctrl: bool (optional, default: false)
#
# Actions:
#   - Command: Execute a TUI command (e.g., "engage", "disengage", "loot")
#   - ToggleMode: Toggle a UI mode (e.g., "help", "privacy", "alert_panel")
#   - OpenHelp: Open the help screen
#   - SendAssist: Send an assist command
#   - Custom: Custom action defined externally

# Global hotkeys available to all characters
[[global]]
binding = { key = "e", shift = false, alt = false, ctrl = false }
action = { type = "Command", value = "engage" }
description = "Start combat"

[[global]]
binding = { key = "d", shift = false, alt = false, ctrl = false }
action = { type = "Command", value = "disengage" }
description = "Stop combat"

[[global]]
binding = { key = "l", shift = false, alt = false, ctrl = false }
action = { type = "Command", value = "loot" }
description = "Loot corpses"

[[global]]
binding = { key = "r", shift = false, alt = false, ctrl = false }
action = { type = "Command", value = "repeat" }
description = "Repeat last command"

[[global]]
binding = { key = "?", shift = false, alt = false, ctrl = false }
action = { type = "ToggleMode", value = "help" }
description = "Open help screen"

[[global]]
binding = { key = "p", shift = false, alt = false, ctrl = false }
action = { type = "ToggleMode", value = "privacy" }
description = "Toggle privacy mode"

[[global]]
binding = { key = "F8", shift = false, alt = false, ctrl = false }
action = { type = "ToggleMode", value = "alert_panel" }
description = "Toggle alert panel"

[[global]]
binding = { key = "F1", shift = false, alt = false, ctrl = false }
action = { type = "ToggleMode", value = "help" }
description = "Open help (alternate)"

[[global]]
binding = { key = "/", shift = false, alt = false, ctrl = false }
action = { type = "Command", value = "search" }
description = "Search spawns"

[[global]]
binding = { key = "m", shift = false, alt = false, ctrl = false }
action = { type = "ToggleMode", value = "map" }
description = "Toggle map visibility (in Overview screen)"

[[global]]
binding = { key = "Tab", shift = false, alt = false, ctrl = false }
action = { type = "Command", value = "cycle_panel" }
description = "Cycle active panel"

# Character-specific hotkeys
[[character_profiles.Warrior]]
binding = { key = "e", shift = false, alt = false, ctrl = false }
action = { type = "Command", value = "warrior_stance" }
description = "Take defensive stance"

[[character_profiles.Wizard]]
binding = { key = "m", shift = false, alt = false, ctrl = false }
action = { type = "Command", value = "cast_mana_shield" }
description = "Cast mana shield"

[[character_profiles.Wizard]]
binding = { key = "F2", shift = false, alt = false, ctrl = false }
action = { type = "Command", value = "evocation" }
description = "Cast evocation (favorite spell)"

[[character_profiles.Cleric]]
binding = { key = "h", shift = false, alt = false, ctrl = false }
action = { type = "Command", value = "cast_heal" }
description = "Cast heal on focus target"

[[character_profiles.Cleric]]
binding = { key = "g", shift = false, alt = false, ctrl = false }
action = { type = "Command", value = "cast_group_heal" }
description = "Cast group heal"
