class_name = "shaman"
role = "healer"
rest_command = "/sit"

# Level 60 Live-safe baseline:
# 1. Slow every new target.
# 2. Cast Malo only after a resisted slow.
# 3. Use Torpor for emergency recovery and Chloroblast for normal triage.
# 4. Convert HP to mana with Cannibalize only when the group is stable.
# 5. Spend excess mana on a single efficient DoT once slow is secure.

