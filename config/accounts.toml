# Account configuration template for TextQuest.
# Replace every __SET_*__ marker before using this file in a live environment.
# Passwords are stored separately in the encrypted credential store.
#
# Usage from TUI:
#   :login all        — launch all accounts below
#   :login G1         — launch only accounts in group 1
#   :login account01  — launch a single account
#   :profile launch MainRaid  — launch all accounts in the "MainRaid" profile group
#   F1 (hotkey)       — launch the profile group assigned to F1

[[accounts]]
name = "account01"
server = "__SET_SERVER__"
character = "__SET_CHARACTER__"
class = "PAL"
group = 1

