# ─── Profile Groups ────────────────────────────────────────────────────────
# Named profile groups for one-action multi-character launches.
# Each profile maps a name and optional hotkey (F1–F9) to a numeric group ID.
# Press the hotkey in the TUI to launch all accounts in that group.
# Use `:profile list` to view profiles, `:profile launch <name>` to launch.

[[profile_groups]]
id = 1
name = "MainRaid"
hotkey = "F1"

