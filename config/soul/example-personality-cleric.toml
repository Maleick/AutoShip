# Soul Engine — Cleric Personality Example
# Character: Luminara the Cleric (devout, caring, patient)

[soul]
enabled = true
edginess = "mild"
idle_tick_secs = 45
min_chat_interval_secs = 90
max_chat_interval_secs = 600
