conscientiousness = 0.85
extraversion = 0.35
agreeableness = 0.90
neuroticism = 0.10
battle_hunger = 0.20
piety = 0.95
greed = 0.25
wanderlust = 0.30
loyalty = 0.95
mischief = 0.15

[soul.character.speech]
vocabulary_level = 0.75
