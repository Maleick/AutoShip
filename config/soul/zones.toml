# Zone classifications for Soul Engine idle behavior constraints.
# Operator overrides — these merge with and override built-in defaults.
#
# Fields:
#   safe          = guards/safe area, wandering encouraged
#   dangerous     = aggressive mobs, wandering suppressed
#   has_water     = fishing allowed
#   has_vendors   = vendor browse allowed
#   npc_density   = 0.0 (empty) .. 1.0 (packed) — affects chat scrutiny
#   is_pvp        = suppress emotes and social behaviors
#   is_social_hub = PoK/Bazaar-style hub — boosts BioBrk and LoreChatter
#   is_raid_zone  = active encounter zone — suppress all idle except Sit
#   has_tradeskill = forge/loom/kiln available — allows Craft behavior

# ── Social Hubs ──────────────────────────────────────────────────────────────

[zones.pok]
safe = true
dangerous = false
has_water = false
has_vendors = true
npc_density = 0.9
is_pvp = false
is_social_hub = true
is_raid_zone = false
has_tradeskill = true

