# Frostreaver Configuration
# EQ process name to attach to
process_name = "eqgame.exe"

# Maximum spawns to read from the linked list (safety limit)
max_spawns = 2048

# ─── Launch Configuration ───
# Controls how EQ clients are started and staggered.
# [launch]
# eq_path = "C:\\EverQuest"
# stagger_min_secs = 3
# stagger_max_secs = 15
# max_concurrent_launches = 3
# launch_args = []
# max_working_set_mb = 800    # Max physical RAM per EQ client (0 = unlimited)

# ─── Server Configuration ───
# Target server name and optional status endpoint.
# [server]
# name = "Frostreaver"
# status_url = "https://example.com/server-status"
# status_check_timeout_secs = 10

# ─── Retry / Backoff Configuration ───
# Controls retry behavior for failed launches and mass-failure detection.
# [retry]
# max_retries = 3
# base_backoff_secs = 30
# mass_failure_threshold = 5
# mass_failure_window_secs = 60

# ─── Soul Engine ───
# AI personality system for character behavior and social dynamics.
# [soul]
# enabled = false
# edginess = "moderate"           # mild | moderate | spicy
# idle_tick_secs = 30
# min_chat_interval_secs = 60
# max_chat_interval_secs = 300
# inter_character_chat = true
# player_chat_enabled = true

# Per-character personality overrides:
# [[soul.character]]
# name = "CharacterName"
# backstory = "A grizzled dwarf cleric who has seen too many group wipes."
# edginess = "spicy"
# quirks = ["mutters prayers under breath", "counts coins obsessively"]

# Pre-defined relationships:
# [[soul.relationship]]
# from = "CharA"
# to = "CharB"
# faction = 500
# tags = ["Friend", "Mentor"]
# trust = 0.8

# ─── Group Definitions ───
# Machine-to-group mapping is flexible — assign groups to machines at deploy time.
