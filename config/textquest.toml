# TextQuest configuration template.
# Replace every __SET_*__ marker before using this file in a live environment.
# Checked-in values here are intentionally non-production placeholders.

# EQ process name to attach to
process_name = "eqgame.exe"

# Maximum spawns to read from the linked list (safety limit)
max_spawns = 2048

# ─── Launch Configuration ───
# Controls how EQ clients are started and staggered.
[launch]
eq_path = "C:\\Path\\To\\EverQuest"
# stagger_min_secs = 3
# stagger_max_secs = 15
# max_concurrent_launches = 3
# launch_args = []
# max_working_set_mb = 800    # Max physical RAM per EQ client (0 = unlimited)

# ─── Server Configuration ───
# Target server name and optional status endpoint.
# Replace the example values below if you enable this section.
# [server]
# name = "__SET_SERVER_NAME__"
# status_url = "https://__SET_STATUS_HOST__.invalid/server-status"
# status_check_timeout_secs = 10

# ─── Retry / Backoff Configuration ───
# Controls retry behavior for failed launches and mass-failure detection.
# [retry]
# max_retries = 3
# base_backoff_secs = 30
# mass_failure_threshold = 5
# mass_failure_window_secs = 60

# ─── Optional Peer Discovery ───
# Enable this to advertise active sessions over UDP multicast and discover
# other TextQuest orchestrators on the same network segment.
# [discovery]
# multicast_enabled = true
# bind_addr = "0.0.0.0"
# multicast_addr = "239.255.42.99"
# port = 35353
# announce_interval_ms = 1000
# peer_ttl_ms = 5000
# node_name = "__SET_NODE_NAME__"  # Optional; empty falls back to hostname
# multicast_ttl = 1

# ─── Optional Network Box Chat ───
# Enable this to expose an EQBC-style TCP relay for `/bc`, `/bca`, `/bcaa`,
# and `/bct` commands across multiple TextQuest machines.
# Set `host` to the relay server machine. When `auto_connect` is false, the
# local TextQuest instance only listens for inbound peers on `port`.
# [box_chat]
# enabled = true
# host = "192.168.1.25"
# port = 2112
# auto_connect = true

# ─── Soul Engine ───
# AI personality system for character behavior and social dynamics.
# [soul]
# enabled = false
# edginess = "moderate"           # mild | moderate | spicy
# idle_tick_secs = 30
# min_chat_interval_secs = 60
# max_chat_interval_secs = 300
# inter_character_chat = true
# player_chat_enabled = true

# Per-character personality overrides:
# [[soul.character]]
# name = "__SET_CHARACTER_NAME__"
# backstory = "Describe the character once operator data is available."
# edginess = "spicy"
# quirks = ["replace me"]

# Pre-defined relationships:
# [[soul.relationship]]
# from = "__SET_CHARACTER_NAME__"
# to = "__SET_CHARACTER_NAME__"
# faction = 500
# tags = ["Friend", "Mentor"]
# trust = 0.8

# ─── Group Definitions ───
# Machine-to-group mapping is flexible — assign groups to machines at deploy time.
# These are template role layouts for the 36-box TextQuest setup.

[[group]]
id = 1
name = "G1_Tank"

[[group.toon]]
name = "__SET_CHARACTER_NAME__"
class = "WAR"
role = "main_tank"

# Optional unattended death handling for this toon. When enabled, TextQuest
# waits `camp_delay_secs` for a rez attempt, then sends `/camp desktop` via the
# existing DLL relog flow and logs the client back in after `relog_wait_secs`.
# [group.toon.auto_camp_on_death]
# enabled = true
# camp_delay_secs = 30
# relog_wait_secs = 900

