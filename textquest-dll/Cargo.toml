[package]
name = "textquest-dll"
version = "0.6.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
textquest-common = { path = "../textquest-common" }
bincode.workspace = true
thiserror = "2"
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true
serde_json.workspace = true
zeroize = "1"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
] }
retour = { version = "0.3", features = ["static-detour"] }

[dev-dependencies]
tempfile = "3"

[features]
# Opt-in gate for Windows runtime tests that require being injected into a real
# process, call Windows thread pool / memory APIs, or exhibit process-teardown
# side-effects that crash the default test harness.
# DO NOT enable in CI; run manually: cargo test -p textquest-dll --features windows-dangerous-tests
windows-dangerous-tests = []
