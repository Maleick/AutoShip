[package]
name = "textquest-dll"
version = "0.6.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
textquest-common = { path = "../textquest-common" }
bincode.workspace = true
serde.workspace = true
bitflags = "2"
thiserror = "2"
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true
serde_json.workspace = true
toml = "0.8"
zeroize = "1"
getrandom = "0.2"
once_cell = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
] }
retour = { version = "0.3", features = ["static-detour"] }

[dev-dependencies]
tempfile = "3"

[features]
windows-dangerous-tests = []
## Enable spell-readiness API on MQ2Bridge::has_spell_ready().
## Requires a fully implemented spell timer system in master.
spell-system = []
## Enable per-dispatch tracing::trace! spans in the command registry.
## Adds structured trace events at command dispatch boundaries with
## cmd_path, args_len, and result fields. Off by default to avoid
## overhead on every command call in production.
trace-commands = []
## Enable per-packet tracing::trace! spans in the packet hook.
## Adds structured trace events at WSASend/WSARecv boundaries with
## packet_op, direction, size, and client_id fields. Off by default
## because it fires on every network packet (very high volume).
trace-packets = []
