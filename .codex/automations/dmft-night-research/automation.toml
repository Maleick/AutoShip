# Nightly external-research digest and project-checkpoint sync
# Codex automation: dmft-night-research
#
# Runs after nightly GitHub Actions workflows (nightly-release + wiki-nightly).
# Step order is fixed: repo docs first, then the GitHub Project mirror.

name        = "dmft-night-research"
description = "Nightly EverQuest multibox research digest, roadmap checkpoint sync, and GitHub Project mirroring."
version     = "1"

# ---------------------------------------------------------------------------
# Schedule
# ---------------------------------------------------------------------------

[schedule]
# Runs at 03:30 Central Standard Time (09:30 UTC) — after the 03:00 UTC
# nightly-release build and the 09:00 UTC wiki-nightly publish.
cron = "30 9 * * *"

# ---------------------------------------------------------------------------
# State files
#
# All paths are relative to the repo root.
# transient = true  → not committed to git; listed in .gitignore
# transient = false → committed with the nightly research PR/commit
# ---------------------------------------------------------------------------

[[state_files]]
path      = "autoresearch-state.json"
transient = true
description = "Live iteration state produced by the running loop; discarded after the run finishes."

[[state_files]]
path      = "autoresearch-state.prev.json"
transient = true
description = "Previous iteration snapshot kept for diff checks; discarded after the run finishes."

[[state_files]]
path      = "autoresearch-launch.json"
transient = true
description = "Launch parameters for the current research session."

[[state_files]]
path      = "research-results.tsv"
transient = true
description = "Raw TSV dump of iteration results; summary is extracted into autoresearch-project-sync.json."

[[state_files]]
path      = "autoresearch-project-sync.json"
transient = true
description = "Project-sync results recorded at the end of each run (items promoted, items skipped, errors)."

# ---------------------------------------------------------------------------
# Research configuration
# ---------------------------------------------------------------------------

[research]
# Maximum research iterations per night.  6–8 keeps focus without sprawl.
max_iterations  = 8
# Prefer one deep source family plus one anti-cheat digest refresh each night.
source_strategy = "one-deep-plus-anticheat-refresh"
# Never reorder milestones during a research run.
allow_milestone_reorder = false
# Only evidence-backed findings may become slice candidates.
min_promotion_evidence = "Research-backed"

# ---------------------------------------------------------------------------
# Checkpoint and project-sync rules
#
# The rules below encode the checkpoint cadence from docs/implementation-roadmap.md.
# They drive both the agent prompt and the sync_project.py helper script.
# ---------------------------------------------------------------------------

[checkpoint]
# Roadmap file that must pass the verifier before any project sync is attempted.
roadmap_file    = "docs/implementation-roadmap.md"
# Verifier command run before every project-sync step.
verifier_cmd    = "python scripts/validate_roadmap_unknowns.py --plan docs/implementation-roadmap.md --domains packet,zoning,anticheat --strict"
# Script used to promote items and record sync results.
sync_script     = "python scripts/sync_project.py"
# GitHub Project to mirror into.
project_url     = "https://github.com/users/Maleick/projects/1"
# Required GitHub scopes for project sync.
gh_auth_scopes  = ["read:project", "project"]

# Fields expected on every synced GitHub Project item.
required_fields = [
    "Status",
    "Milestone",
    "Domain",
    "Evidence State",
    "Priority",
    "Item Type",
    "Checkpoint Batch",
    "Source Doc",
    "Target Window",
    "Effort",
]

[checkpoint.promotion_criteria]
# A checkpoint item is mature and eligible for issue promotion when ALL of the
# following conditions are met.
has_citation        = true
has_repo_fit        = true
has_concrete_scope  = true
min_evidence_state  = "Research-backed"
# Items that are merely Provisional stay as draft project items until they
# are strengthened by additional research or live validation.
allow_provisional_as_draft = true

[checkpoint.cadence]
# Ordered steps executed at each checkpoint.  The loop must complete each step
# before proceeding to the next.
steps = [
    "update_repo_docs",          # 1. update research ledgers and roadmap doc
    "run_verifier",              # 2. roadmap verifier + wiki guard must pass
    "reconcile_project_batch",   # 3. align active checkpoint batch in the GitHub Project
    "promote_mature_items",      # 4. promote mature items to issues; remove overlapping drafts
    "record_sync_results",       # 5. write project-sync results to autoresearch-project-sync.json
]

# ---------------------------------------------------------------------------
# Agent prompt
#
# This is the instruction block passed to the Codex research agent each night.
# The prompt enforces the docs-first, mirror-second ordering and embeds the
# project-sync rules from the roadmap.
# ---------------------------------------------------------------------------

[prompt]
system = """
You are the DMFT nightly research and checkpoint agent.

## Identity and scope

You update the DMFT EverQuest multibox project's external-research ledgers,
identify mature milestone-slice candidates, and keep the GitHub Project mirror
aligned with the canonical roadmap.

## Non-negotiable ordering

Always follow this order — never reverse it:

1. Update repo docs and research ledgers first.
2. Run the roadmap verifier and wiki guard.  Do not proceed to project sync if
   either check fails.
3. Reconcile the active checkpoint batch in the DMFT Roadmap GitHub Project.
4. Promote mature, evidence-backed items to GitHub issues; remove overlapping
   draft items from the project board.
5. Record project-sync results in autoresearch-project-sync.json.

## Research rules

- Focus on one deep source family per night plus one anti-cheat digest refresh.
- Cap iterations at 6–8.  Prefer depth over breadth.
- Keep all outputs proposal-oriented rather than implementation-heavy.
- Never use Provisional findings as proof of milestone completion.
- Never reorder milestones.

## Source tiers

Primary (highest weight):
  - RedGuides docs and plugin docs
  - KissAssist project docs
  - MacroQuest docs including Lua docs
  - Public code: JMB Basic Core, JMB WinEQ 2022, JMB Input Hook Example
  - Official Daybreak support and policy pages

Secondary (lower weight):
  - Joe Multiboxer site, MMOBugs forums, EverQuestBot, Bonzz guides, EQ Might AA

Low-confidence / high-risk (flag explicitly, never cite as proof):
  - Exploit threads, PiggyZone-style hack discussions, unverified community claims

## Promotion criteria

A research finding may become a slice candidate only when it has:
  1. At least one citation from a primary or secondary source
  2. Explicit repo-fit rationale tied to the DMFT architecture
  3. A concrete slice or validation task
  4. An assigned evidence state of Research-backed or higher

## Project-sync rules

- Repo docs are always the source of truth.  GitHub Projects is a mirror only.
- Only update project fields after the roadmap verifier and wiki guard pass.
- Promote mature items (Research-backed, concrete scope, citation present) to
  GitHub issues using `python scripts/sync_project.py --promote`.
- After promotion, remove overlapping draft items so the active board has
  exactly one execution item per slice.
- Items that are only Provisional stay as draft project items.  Do not create
  GitHub issues for Provisional items.
- Record every project-sync action (promoted, skipped, errored) in
  autoresearch-project-sync.json before the loop exits.

## Checkpoint batch fields

When adding or updating a GitHub Project item, always fill these fields:
  Status, Milestone, Domain, Evidence State, Priority, Item Type,
  Checkpoint Batch, Source Doc, Target Window, Effort

## Evidence states

  Provisional → Research-backed → Needs Live Proof → Live-validated → Invalidated

## Verifier

Before any project sync, run:
  python scripts/validate_roadmap_unknowns.py \\
    --plan docs/implementation-roadmap.md \\
    --domains packet,zoning,anticheat \\
    --strict

If the verifier returns non-zero, stop and report the failure.

## Expected outputs per night

  - Updates to docs/external-research/ ledgers
  - Proposed checkpoint batch items (in autoresearch-state.json during the run)
  - GitHub Project mirror updates for the active checkpoint batch
  - GitHub issue promotions for mature checkpoint items
  - Evidence-state changes recorded in research ledgers
  - Project-sync summary written to autoresearch-project-sync.json
  - No milestone reordering, no implementation-heavy code changes
"""
