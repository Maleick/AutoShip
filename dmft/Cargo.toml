[package]
name = "dmft"
version = "0.5.0"
edition = "2024"
description = "External process memory reader and multibox controller for EverQuest (TLP 36-box)"

[dependencies]
dmft-common = { path = "../dmft-common" }
bincode.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true
ratatui = "0.30"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
argon2 = "0.5"
rpassword = "7"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
zeroize = { version = "1", features = ["alloc"] }
prost = "0.13"
flate2 = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
recastnavigation-sys = { version = "1.0.3", features = ["detour_large_nav_meshes"] }
tui-menu = "0.3"
tui-tree-widget = "0.24"
tui-widget-list = "0.15"
tui-scrollview = "0.6"
tui-big-text = "0.8"
tui-popup = "0.7"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
] }
