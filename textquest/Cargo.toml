[package]
name = "textquest"
version = "0.6.0"
edition = "2024"
description = "External process memory reader and multibox controller for EverQuest (TLP 36-box)"

[dependencies]
textquest-common = { path = "../textquest-common" }
textquest-soul = { path = "../textquest-soul" }
bincode.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
regex.workspace = true
strsim = "0.11"
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true
thiserror.workspace = true
mlua = { workspace = true, features = ["lua54", "vendored", "send"] }
ratatui = "0.30"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
argon2 = "0.5"
rpassword = "7"
rand = "0.9"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
zeroize = { version = "1", features = ["alloc"] }
prost = "0.13"
flate2 = "1"
goblin = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tui-menu = "0.3"
tui-tree-widget = "0.24"
tui-widget-list = "0.15"
tui-scrollview = "0.6"
tui-big-text = "0.8"
tui-popup = "0.7"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "cache", "rustls_backend"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname"] }
ureq = "2"
bytemuck = { version = "1", features = ["derive"] }
libloading = "0.8"

[build-dependencies]
cc = "1"

[features]
default = []

[[bin]]
name = "textquest-admin"
path = "src/bin/textquest_admin.rs"

[target.'cfg(windows)'.dependencies]
recastnavigation-sys = { version = "1.0.3", features = ["detour_large_nav_meshes"] }
rodio = { version = "0.19", default-features = false, features = ["wav", "mp3"] }
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
] }
