name: Setup Rust toolchain on Windows
description: >
  Install or verify a rustup-managed MSVC toolchain on a self-hosted Windows
  runner, add requested components, and scope activation to the checked-out
  workspace.

inputs:
  toolchain:
    description: "Rustup toolchain identifier"
    required: true
  components:
    description: "Space-delimited rustup components to add"
    required: false
    default: "clippy"

runs:
  using: composite
  steps:
    - name: Provision toolchain via rustup
      shell: powershell
      env:
        WINDOWS_TOOLCHAIN: ${{ inputs.toolchain }}
        WINDOWS_COMPONENTS: ${{ inputs.components }}
      run: |
        $cargoHome = $env:CARGO_HOME
        if ([string]::IsNullOrWhiteSpace($cargoHome)) {
          $cargoHome = Join-Path $env:USERPROFILE ".cargo"
        }

        $rustupHome = $env:RUSTUP_HOME
        if ([string]::IsNullOrWhiteSpace($rustupHome)) {
          $rustupHome = Join-Path $env:USERPROFILE ".rustup"
        }

        $env:CARGO_HOME = $cargoHome
        $env:RUSTUP_HOME = $rustupHome

        $rustup = Join-Path $cargoHome "bin\rustup.exe"
        $rustupBin = Split-Path -Parent $rustup
        New-Item -ItemType Directory -Force -Path $rustupBin | Out-Null

        if (-not (Test-Path $rustup)) {
          $installer = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
          Write-Host "[info] rustup.exe not found; bootstrapping rustup from the official installer."
          Invoke-WebRequest `
            -Uri "https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe" `
            -OutFile $installer
          & $installer -y --profile minimal
          if ($LASTEXITCODE -ne 0) {
            throw "rustup-init.exe failed with exit code $LASTEXITCODE"
          }
        }

        $env:PATH = "$rustupBin;$env:PATH"
        Add-Content -Path $env:GITHUB_PATH -Value $rustupBin

        if (-not (Test-Path $rustup)) {
          throw "rustup.exe still not found at $rustup after bootstrap."
        }

        Write-Host "[info] Ensuring Rust toolchain $env:WINDOWS_TOOLCHAIN is available on this runner."
        & $rustup --version
        & $rustup toolchain install $env:WINDOWS_TOOLCHAIN --no-self-update --profile minimal
        & $rustup override set $env:WINDOWS_TOOLCHAIN

        if ($env:WINDOWS_COMPONENTS) {
          & $rustup component add $env:WINDOWS_COMPONENTS --toolchain $env:WINDOWS_TOOLCHAIN
        }

        $activeToolchain = & $rustup show active-toolchain
        if ($activeToolchain -notmatch [regex]::Escape($env:WINDOWS_TOOLCHAIN)) {
          Write-Host "[fatal] rustup override did not activate $env:WINDOWS_TOOLCHAIN."
          & $rustup show active-toolchain
          exit 1
        }

        & $rustup run $env:WINDOWS_TOOLCHAIN rustc -V
        cargo -V
        Write-Host "[info] Rust toolchain ready: $env:WINDOWS_TOOLCHAIN"
