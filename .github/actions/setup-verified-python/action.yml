name: Setup verified Python
description: >
  Prefer an existing Python executable on Windows runners, otherwise download
  and verify the approved embedded Python runtime before exposing PYTHON_CMD.

inputs:
  python-embed-url:
    description: "Embedded Python ZIP to download when Python is missing from PATH"
    required: false
    default: "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
  python-embed-sha256:
    description: "Expected SHA-256 for the embedded Python ZIP"
    required: false
    default: "4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3"

runs:
  using: composite
  steps:
    - name: Locate or provision verified Python
      shell: cmd
      env:
        PYTHON_EMBED_URL: ${{ inputs.python-embed-url }}
        PYTHON_EMBED_SHA256: ${{ inputs.python-embed-sha256 }}
      run: |
        where python >nul 2>nul && (
          echo PYTHON_CMD=python>>"%GITHUB_ENV%"
          python --version
          exit /b 0
        )
        where py >nul 2>nul && (
          echo PYTHON_CMD=py -3>>"%GITHUB_ENV%"
          py -3 --version
          exit /b 0
        )
        setlocal EnableDelayedExpansion
        if exist .ci-python rmdir /s /q .ci-python
        mkdir .ci-python
        curl.exe -fsSL -o .ci-python\python-embed.zip "%PYTHON_EMBED_URL%"
        for /f "tokens=* delims=" %%H in ('certutil -hashfile ".ci-python\python-embed.zip" SHA256 ^| findstr /r /v /c:"^SHA256" /c:"^CertUtil" /c:"^$"') do (
          set "PYTHON_EMBED_ACTUAL_SHA256=%%H"
        )
        set "PYTHON_EMBED_ACTUAL_SHA256=!PYTHON_EMBED_ACTUAL_SHA256: =!"
        if /I not "!PYTHON_EMBED_ACTUAL_SHA256!"=="%PYTHON_EMBED_SHA256%" (
          echo [fatal] Verified Python download checksum mismatch.
          echo [fatal] Expected: %PYTHON_EMBED_SHA256%
          echo [fatal] Actual:   !PYTHON_EMBED_ACTUAL_SHA256!
          del /f /q ".ci-python\python-embed.zip" 2>nul || echo [warn] Failed to delete corrupt python-embed.zip.
          exit /b 1
        )
        tar -xf .ci-python\python-embed.zip -C .ci-python
        del /f /q ".ci-python\python-embed.zip" 2>nul || echo [warn] Failed to delete python-embed.zip after extraction.
        if not exist .ci-python\python.exe (
          echo [fatal] Extracted python.exe not found after verified download.
          exit /b 1
        )
        endlocal & (
          echo PYTHON_CMD=%CD%\.ci-python\python.exe>>"%GITHUB_ENV%"
        )
        "%CD%\.ci-python\python.exe" --version
