name: Agent task
description: Structured issue form for autonomous Codex or Claude execution.
title: "[agent] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for work you want an autonomous coding agent to execute.

        Queue rule:
        - the issue is only eligible for automatic pickup after it has label `agent:ready`
        - assign the relevant roadmap milestone when known
        - keep GitHub Projects historical only; do not rely on `Agent Status`

        Optional routing and risk controls:
        - add `mode:research` for docs-first research work
        - add `worker:claude` to route execution to Claude instead of Codex
        - add `merge:auto` to allow unattended merge after all gates clear
        - add `human:required` or `risk:high` to prevent unattended merge

  - type: textarea
    id: description
    attributes:
      label: Task Description
      description: Clear, concise summary and links to parent epic or dependencies.
      placeholder: |
        - summary of goal
        - parent epic: #...
        - dependencies: #...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope for the agent to change?
      placeholder: |
        - files, modules, or user-facing behaviors that may change
        - what does NOT get built
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Design
      description: Architecture, data structures, and API contracts.
      placeholder: |
        - diagrams or flow
        - data structures (field descriptions)
        - configuration format
    validations:
      required: false

  - type: textarea
    id: implementation_notes
    attributes:
      label: Implementation Notes
      description: Key algorithms, patterns, performance, and platform-specific handling.
      placeholder: |
        - algorithms
        - performance considerations
        - #[cfg(windows)] vs stubs
    validations:
      required: false

  - type: textarea
    id: testing
    attributes:
      label: Testing
      description: Unit tests, integration scenarios, and performance benchmarks.
      placeholder: |
        - unit test expectations
        - integration test scenarios
        - coverage target (>70%)
    validations:
      required: true

  - type: textarea
    id: done_when
    attributes:
      label: Done when (Acceptance Criteria)
      description: What outcomes or acceptance checks define success?
      placeholder: |
        - [ ] feature implemented
        - [ ] tests pass (>70% coverage)
        - [ ] no clippy warnings
        - [ ] formatted with rustfmt
        - [ ] documentation added
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: Verify
      description: Commands or checks the agent must run before opening the PR.
      placeholder: |
        cargo fmt --all --check
        cargo test
        python3 scripts/sync_wiki.py --check
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What should the agent explicitly avoid changing?
      placeholder: |
        - related work that should not be pulled into this issue
        - risk boundaries
    validations:
      required: true

  - type: textarea
    id: source_docs
    attributes:
      label: Source docs
      description: Canonical docs, roadmap notes, or prior issues the agent should read first.
      placeholder: |
        - docs/implementation-roadmap.md
        - docs/external-research/...
        - linked issue or PR numbers
    validations:
      required: true
