name: Nightly Release

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: write
  actions: write

jobs:
  gate:
    name: Nightly/manual full-validation gate
    runs-on: [self-hosted, Windows, X64, textquest]
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    defaults:
      run:
        shell: cmd
    steps:
      - id: gate
        shell: cmd
        run: |
          setlocal
          set "EVENT_NAME=${{ github.event_name }}"

          if "%EVENT_NAME%"=="workflow_dispatch" (
            echo should_run=true>>%GITHUB_OUTPUT%
            exit /b 0
          )

          set "should_run=false"
          for /f "delims=" %%T in ('powershell -NoProfile -ExecutionPolicy Bypass -Command "$tz = [System.TimeZoneInfo]::FindSystemTimeZoneById(\"Central Standard Time\"); $local = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $tz); if ($local.Hour -eq 3) { \"true\" } else { \"false\" }"') do set "should_run=%%T"

          if errorlevel 1 (
            echo Local-time gate failed; defaulting should_run=false.
            echo should_run=false>>%GITHUB_OUTPUT%
            exit /b 0
          )

          echo should_run=%should_run%>>%GITHUB_OUTPUT%

  build-nightly:
    name: Build rolling nightly prerelease
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: [self-hosted, Windows, X64, textquest]
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git safe directories
        uses: ./.github/actions/configure-safe-directory

      - name: Initialize reference submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Setup Rust nightly
        uses: ./.github/actions/setup-rust-nightly

      - name: Ensure cmake on PATH
        uses: ./.github/actions/ensure-cmake

      - name: Build release binaries
        run: cargo build --release
        env:
          LIBCLANG_PATH: "C:/Program Files/LLVM/lib"

      - name: Package nightly artifacts
        run: |
          if not exist release mkdir release
          if not exist target\release\textquest.exe (
            echo [fatal] Expected target\release\textquest.exe to exist after the build.
            exit /b 1
          )
          if not exist target\release\textquest_dll.dll (
            echo [fatal] Expected target\release\textquest_dll.dll to exist after the build.
            exit /b 1
          )
          copy /Y target\release\textquest.exe release\
          copy /Y target\release\textquest_dll.dll release\
          for /f "delims=" %%T in ('powershell -NoProfile -ExecutionPolicy Bypass -Command "[DateTime]::UtcNow.ToString('o')"') do set "UTC_TS=%%T"
          echo TextQuest Nightly > release\NOTES.txt
          echo Commit: %GITHUB_SHA% >> release\NOTES.txt
          echo Run: %GITHUB_RUN_NUMBER% >> release\NOTES.txt
          echo UTC: %UTC_TS% >> release\NOTES.txt

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: textquest-nightly-${{ github.run_number }}
          path: |
            release/textquest.exe
            release/textquest_dll.dll
          if-no-files-found: error

      - name: Move nightly tag to current commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa nightly -m "Nightly build %GITHUB_RUN_NUMBER%"
          git push origin refs/tags/nightly --force

      - name: Create or update rolling nightly prerelease
        uses: ncipollo/release-action@v1.14.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "release/textquest.exe,release/textquest_dll.dll"
          bodyFile: "release/NOTES.txt"
          name: "TextQuest Nightly"
          prerelease: true
          removeArtifacts: true
          replacesArtifacts: true
          tag: nightly
