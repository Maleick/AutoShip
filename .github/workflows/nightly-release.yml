name: Nightly Release

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: write

jobs:
  gate:
    name: Local time gate
    runs-on: [self-hosted, Windows, X64, dmft]
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    defaults:
      run:
        shell: cmd
    steps:
      - id: gate
        shell: cmd
        run: |
          setlocal
          set "EVENT_NAME=${{ github.event_name }}"

          if "%EVENT_NAME%"=="workflow_dispatch" (
            echo should_run=true>>%GITHUB_OUTPUT%
            exit /b 0
          )

          set "should_run=false"
          for /f "delims=" %%T in ('powershell -NoProfile -ExecutionPolicy Bypass -Command "$tz = [System.TimeZoneInfo]::FindSystemTimeZoneById(\"Central Standard Time\"); $local = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $tz); if ($local.Hour -eq 3) { \"true\" } else { \"false\" }"') do set "should_run=%%T"

          if errorlevel 1 (
            echo Local-time gate failed; defaulting should_run=false.
            echo should_run=false>>%GITHUB_OUTPUT%
            exit /b 0
          )

          echo should_run=%should_run%>>%GITHUB_OUTPUT%

  build-nightly:
    name: Build rolling nightly prerelease
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: [self-hosted, Windows, X64, dmft]
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git safe directories for runner account
        run: |
          if "%GITHUB_WORKSPACE%"=="" (
            echo [fatal] GITHUB_WORKSPACE is not defined.
            exit /b 1
          )
          for %%D in ("%GITHUB_WORKSPACE%" "C:\actions-runner\_work\DMFT\DMFT" "C:\actions-runner\_work\DMFT") do (
            git config --global --add safe.directory "%%~D" || (
              echo [fatal] Failed to add safe.directory for %%~D.
              exit /b 1
            )
          )
          echo [info] Active safe.directory values:
          git config --global --get-all safe.directory

      - name: Initialize reference submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Provision nightly toolchain via rustup
        env:
          NIGHTLY_TOOLCHAIN: nightly-x86_64-pc-windows-msvc
        run: |
          if not defined CARGO_HOME set "CARGO_HOME=%USERPROFILE%\.cargo"
          if not defined RUSTUP_HOME set "RUSTUP_HOME=%USERPROFILE%\.rustup"
          set "PATH=%CARGO_HOME%\bin;%PATH%"
          echo [info] Ensuring Rust toolchain %NIGHTLY_TOOLCHAIN% is available on this runner.
          where rustup.exe >nul 2>nul || (
            echo [warn] rustup.exe not found in PATH. Installing rustup bootstrap.
            curl.exe -fSLo "%TEMP%\rustup-init.exe" https://win.rustup.rs/x86_64
            start /wait "" "%TEMP%\rustup-init.exe" -y --no-modify-path --default-toolchain %NIGHTLY_TOOLCHAIN%
            if errorlevel 1 (
              echo [fatal] rustup bootstrap failed.
              exit /b 1
            )
            del /f /q "%TEMP%\rustup-init.exe"
          )

          where rustup.exe >nul 2>nul || (
            echo [fatal] rustup.exe still not available after bootstrap.
            exit /b 1
          )
          echo %CARGO_HOME%\bin>>%GITHUB_PATH%
          echo [info] rustup version:
          rustup --version
          rustup show
          rustup toolchain install %NIGHTLY_TOOLCHAIN% --no-self-update
          rustup default %NIGHTLY_TOOLCHAIN%
          rustup component add rustfmt clippy --toolchain %NIGHTLY_TOOLCHAIN%
          rustup run %NIGHTLY_TOOLCHAIN% rustc -V | findstr /i "nightly" >nul || (
            echo [fatal] rustc for %NIGHTLY_TOOLCHAIN% is not reporting a nightly compiler.
            exit /b 1
          )

      - name: Ensure cmake on PATH
        uses: ./.github/actions/ensure-cmake

      - name: Build release binaries
        run: cargo build --release
        env:
          LIBCLANG_PATH: "C:/Program Files/LLVM/lib"

      - name: Package nightly artifacts
        run: |
          if not exist release mkdir release
          if not exist target\release\dmft.exe (
            echo [fatal] Expected target\release\dmft.exe to exist after the build.
            exit /b 1
          )
          if not exist target\release\dmft_dll.dll (
            echo [fatal] Expected target\release\dmft_dll.dll to exist after the build.
            exit /b 1
          )
          copy /Y target\release\dmft.exe release\
          copy /Y target\release\dmft_dll.dll release\
          for /f "delims=" %%T in ('powershell -NoProfile -ExecutionPolicy Bypass -Command "[DateTime]::UtcNow.ToString('o')"') do set "UTC_TS=%%T"
          echo DMFT Nightly > release\NOTES.txt
          echo Commit: %GITHUB_SHA% >> release\NOTES.txt
          echo Run: %GITHUB_RUN_NUMBER% >> release\NOTES.txt
          echo UTC: %UTC_TS% >> release\NOTES.txt

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dmft-nightly-${{ github.run_number }}
          path: |
            release/dmft.exe
            release/dmft_dll.dll
          if-no-files-found: error

      - name: Move nightly tag to current commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa nightly -m "Nightly build %GITHUB_RUN_NUMBER%"
          git push origin refs/tags/nightly --force

      - name: Create or update rolling nightly prerelease
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "release/dmft.exe,release/dmft_dll.dll"
          bodyFile: "release/NOTES.txt"
          name: "DMFT Nightly"
          prerelease: true
          removeArtifacts: true
          replacesArtifacts: true
          tag: nightly
