name: Cleanup Stale Branches

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Delete stale branches
        uses: phpdocker-io/github-action-remove-stale-branches@v1.0.0
        with:
          days: 30
          protected_branches: 'main,develop,master'
          delete_tags: false

      - name: Report cleanup
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Scheduled] Stale branch cleanup completed',
              body: 'Branches not updated in 30 days have been removed (excluding protected branches).',
              labels: ['automated']
            })
