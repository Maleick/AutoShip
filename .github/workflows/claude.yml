name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  schedule:
    - cron: "0 6 * * *" # Daily at 6 AM UTC

jobs:
  claude:
    # Run when someone @mentions claude in a comment
    if: |
      github.event_name != 'schedule' &&
      contains(github.event.comment.body, '@claude') &&
      (
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        github.event.comment.user.login == 'github-actions[bot]'
      )
    name: Claude
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || github.event_name == 'pull_request_review_comment' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-20250514
          timeout_minutes: 15
          allowed_tools: |
            Bash(cargo fmt --all --check)
            Bash(cargo clippy --all-targets --all-features -- -D warnings)
            Bash(git diff *)
            Bash(git log *)
            Bash(git status)
            Read
            Edit
            Write

  nightly-review:
    # Review all open PRs once per day
    if: github.event_name == 'schedule'
    name: Nightly PR Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review open PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs=$(gh pr list --repo ${{ github.repository }} --state open --json number,headRefName --jq '.[].number')
          if [ -z "$prs" ]; then
            echo "No open PRs to review."
            exit 0
          fi
          for pr in $prs; do
            gh pr comment "$pr" --repo ${{ github.repository }} \
              --body "@claude Review this PR. Focus on correctness, safety, and adherence to CLAUDE.md and REVIEW.md conventions. Be concise — flag only real issues."
          done
