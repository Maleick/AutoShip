name: Issue and PR Automation

on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  pull_request_target:
    types: [labeled, unlabeled, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:

concurrency:
  group: automation-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_target' }}

permissions:
  contents: read

jobs:
  agent-ready:
    name: Auto-label agent:ready
    if: github.event_name == 'issues' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 5
    runs-on: [self-hosted, Linux, X64, textquest]
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Ensure agent:ready label state
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const readyLabel = "agent:ready";
            const skipLabel = "agent:skip-ready";
            const requiredReadySectionGroups = [
              ["Task Description"],
              ["Scope"],
              ["Implementation Notes"],
              ["Testing"],
              ["Acceptance Criteria", "Done when (Acceptance Criteria)", "Acceptance"],
            ];
            const requiredLabels = [
              { name: readyLabel, color: "0E8A16", description: "Issue is eligible for autonomous pickup." },
              { name: skipLabel, color: "D93F0B", description: "Roadmap container issues are intentionally excluded." },
            ];

            function escapeRegExp(value) {
              return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            }

            function hasRequiredReadySections(body) {
              return requiredReadySectionGroups.every(group =>
                group.some(section => {
                  const pattern = new RegExp(`(^|\\n)#{2,3}\\s+${escapeRegExp(section)}\\s*(\\n|$)`, "i");
                  return pattern.test(body || "");
                })
              );
            }

            async function hasOpenLinkedPr(issueNumber) {
              let page = 1;
              while (true) {
                const { data: events } = await github.request(
                  "GET /repos/{owner}/{repo}/issues/{issue_number}/timeline",
                  {
                    owner,
                    repo,
                    issue_number: issueNumber,
                    per_page: 100,
                    page,
                    headers: { accept: "application/vnd.github+json" },
                  }
                );

                for (const event of events) {
                  const candidates = [
                    event.event === "connected" ? event.subject : null,
                    event.event === "cross-referenced" ? event.source?.issue : null,
                  ];
                  for (const candidate of candidates) {
                    const state = (candidate?.state || "").toLowerCase();
                    if (
                      candidate?.pull_request &&
                      state === "open" &&
                      candidate.repository?.owner?.login === owner &&
                      candidate.repository?.name === repo
                    ) {
                      return true;
                    }
                  }
                }
                if (events.length < 100) return false;
                page += 1;
              }
            }

            async function ensureLabel(definition) {
              try { await github.rest.issues.getLabel({ owner, repo, name: definition.name }); }
              catch (e) { if (e.status === 404) await github.rest.issues.createLabel({ owner, repo, ...definition }); else throw e; }
            }

            async function ensureReadyState(issue) {
              const { number, state, title, labels: currentLabels } = issue;
              const normalized = new Set((currentLabels || []).map(l => (l.name || "").toLowerCase()));
              const hasReady = normalized.has(readyLabel);
              const shouldSkip = normalized.has(skipLabel) || /^M(\d+|x)\b/i.test((title || "").trim());
              const isClosed = state !== "open";
              const missingRequiredSections = !hasRequiredReadySections(issue.body || "");
              const shouldWithholdReady =
                normalized.has("agent:working") ||
                normalized.has("agent:blocked") ||
                normalized.has("human:required") ||
                normalized.has("risk:high") ||
                missingRequiredSections ||
                (await hasOpenLinkedPr(number));

              if ((isClosed || shouldSkip || shouldWithholdReady) && hasReady) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: readyLabel });
              } else if (!isClosed && !shouldSkip && !shouldWithholdReady && !hasReady) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [readyLabel] });
              }
            }

            for (const def of requiredLabels) await ensureLabel(def);

            if (context.eventName === "issues") {
              await ensureReadyState(context.payload.issue);
            } else {
              const openIssues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", per_page: 100 });
              for (const issue of openIssues) { if (!issue.pull_request) await ensureReadyState(issue); }
            }

  agent-close:
    name: Auto-close agent PRs
    if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 5
    runs-on: [self-hosted, Linux, X64, textquest]
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Close agent PRs with agent:close label
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const closeLabel = "agent:close";

            async function closePr(pr) {
              const labels = new Set((pr.labels || []).map(l => (l.name || "").toLowerCase()));
              const isAgentOwned = (pr.head?.ref || "").startsWith("codex/") || (pr.head?.ref || "").startsWith("claude/") || labels.has("codex-automation");
              if (!isAgentOwned || !labels.has(closeLabel) || pr.state !== "open") return;

              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              const marker = "Closing automatically because `agent:close` is set.";
              if (!comments.some(c => c.body?.includes(marker))) {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: `${marker} Remove label and reopen if needed.` });
              }
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: "closed" });
            }

            if (context.eventName === "pull_request_target") {
              await closePr(context.payload.pull_request);
            } else {
              const openPrs = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
              for (const pr of openPrs) await closePr(pr);
            }

  auto-merge:
    name: Enable auto-merge
    if: >
      (github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open' && (contains(github.event.pull_request.labels.*.name, 'merge:auto') || contains(github.event.pull_request.labels.*.name, 'merge:block') || contains(github.event.pull_request.labels.*.name, 'agent:blocked') || contains(github.event.pull_request.labels.*.name, 'human:required') || contains(github.event.pull_request.labels.*.name, 'risk:high'))) ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 5
    runs-on: [self-hosted, Linux, X64, textquest]
    permissions:
      issues: read
      pull-requests: write
    steps:
      - name: Enable auto-merge on labeled PRs
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const mergeLabel = "merge:auto";
            const blockingLabels = new Set(["merge:block", "agent:blocked", "human:required", "risk:high"]);

            function labelSet(labels) {
              return new Set((labels || []).map(label => (label.name || "").toLowerCase()));
            }

            function extractLinkedIssueNumbers(body) {
              return [...(body || "").matchAll(/(?:fix(?:es)?|close(?:s)?|resolve(?:s)?)\s+#(\d+)/gi)].map(match => parseInt(match[1], 10));
            }

            async function linkedIssueHasBlockingLabels(issueNumber) {
              const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              const labels = labelSet(issue.data.labels);
              return [...blockingLabels].some(label => labels.has(label));
            }

            async function autoMergeBlockReason(pr) {
              const labels = labelSet(pr.data.labels);
              if (pr.data.draft) return "PR is draft";
              const blockingPrLabel = [...blockingLabels].find(label => labels.has(label));
              if (blockingPrLabel) return `PR has blocking label ${blockingPrLabel}`;
              for (const issueNumber of extractLinkedIssueNumbers(pr.data.body || "")) {
                if (await linkedIssueHasBlockingLabels(issueNumber)) return `linked issue #${issueNumber} has a blocking label`;
              }
              return null;
            }

            async function shouldSkipAutoMerge(pr) {
              return (await autoMergeBlockReason(pr)) !== null;
            }

            async function disableAutoMerge(prNumber, prId, reason) {
              if (!reason) return;
              if (!prId) {
                core.info(`Skipped disabling auto-merge on PR #${prNumber}: missing pull request node ID.`);
                return;
              }
              try {
                await github.graphql(`mutation($prId: ID!) { disablePullRequestAutoMerge(input: { pullRequestId: $prId }) { clientMutationId } }`, { prId });
                core.info(`Disabled auto-merge on PR #${prNumber}: ${reason}.`);
              } catch (e) {
                core.info(`Auto-merge was not active or could not be disabled on PR #${prNumber}: ${e.message}`);
              }
            }

            async function enableAutoMerge(prNumber) {
              try {
                const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                const blockReason = await autoMergeBlockReason(pr);
                if (blockReason) {
                  await disableAutoMerge(prNumber, pr.data.node_id, blockReason);
                  core.info(`Skipped auto-merge on PR #${prNumber}: ${blockReason}.`);
                  return;
                }
                await github.graphql(`mutation($prId: ID!) { enablePullRequestAutoMerge(input: { pullRequestId: $prId, mergeMethod: SQUASH }) { clientMutationId } }`, { prId: pr.data.node_id });
                core.info(`Enabled auto-merge on PR #${prNumber}`);
              } catch (e) { core.warning(`Failed for PR #${prNumber}: ${e.message}`); }
            }

            if (context.eventName === "pull_request_target") {
              await enableAutoMerge(context.payload.pull_request.number);
            } else {
              const openPrs = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
              for (const pr of openPrs) { if (pr.labels?.some(l => l.name === mergeLabel)) await enableAutoMerge(pr.number); }
            }

  post-merge:
    name: Post-merge sync
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master'
    timeout-minutes: 5
    runs-on: [self-hosted, Linux, X64, textquest]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Clean labels, sync linked issues, and delete merged branch
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const prBody = pr.body || "";

            const labelsToRemove = ["agent:working", "agent:ready", "merge:auto", "agent:blocked"];
            for (const label of labelsToRemove) {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: label }); } catch (_) {}
            }

            const linkedIssues = [...prBody.matchAll(/(?:fix(es)?|close(s)?|resolve(s)?)\s+#(\d+)/gi)].map(m => parseInt(m[3], 10));
            for (const issueNumber of linkedIssues) {
              for (const label of labelsToRemove) {
                try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label }); } catch (_) {}
              }
            }

      - name: Delete merged head branch
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'master'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.pull_request.head.ref;

            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${ref}` });
              core.info(`Deleted merged branch ${ref}`);
            } catch (error) {
              core.warning(`Skipped deleting merged branch ${ref}: ${error.message}`);
            }

      - name: Checkout merged branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish wiki changes to TextQuest.wiki
        run: python3 scripts/sync_wiki.py --push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
