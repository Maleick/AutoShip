name: Project Automation

on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  pull_request:
    types: [labeled, synchronize, closed]
  pull_request_target:
    types: [labeled, reopened, synchronize, ready_for_review]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "0 11 * * *" # Daily 6am CT: agent-ready + agent-close sweep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-ready:
    name: Auto-label agent:ready
    if: github.event_name == 'issues' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, textquest]
    permissions:
      issues: write
    steps:
      - name: Ensure agent:ready label state
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const readyLabel = "agent:ready";
            const skipLabel = "agent:skip-ready";
            const requiredLabels = [
              { name: readyLabel, color: "0E8A16", description: "Issue is eligible for autonomous pickup." },
              { name: skipLabel, color: "D93F0B", description: "Roadmap container issues are intentionally excluded." },
            ];

            async function hasOpenLinkedPr(issueNumber) {
              let cursor = null;
              while (true) {
                const result = await github.graphql(`
                    query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                      repository(owner: $owner, name: $repo) {
                        issue(number: $number) {
                          timelineItems(first: 100, after: $cursor, itemTypes: [CONNECTED_EVENT, CROSS_REFERENCED_EVENT]) {
                            pageInfo { hasNextPage, endCursor }
                            nodes {
                              __typename
                              ... on ConnectedEvent { subject { __typename ... on PullRequest { state, repository { name, owner { login } } } } }
                              ... on CrossReferencedEvent { source { __typename ... on PullRequest { state, repository { name, owner { login } } } } }
                            }
                          }
                        }
                      }
                    }
                  `, { owner, repo, number: issueNumber, cursor });
                const timeline = result.repository.issue.timelineItems;
                for (const node of timeline.nodes) {
                  const pr = node.__typename === "ConnectedEvent" ? node.subject : node.source;
                  if (pr?.__typename === "PullRequest" && pr.state === "OPEN" && pr.repository?.owner?.login === owner && pr.repository?.name === repo) return true;
                }
                if (!timeline.pageInfo.hasNextPage) return false;
                cursor = timeline.pageInfo.endCursor;
              }
            }

            async function ensureLabel(definition) {
              try { await github.rest.issues.getLabel({ owner, repo, name: definition.name }); }
              catch (e) { if (e.status === 404) await github.rest.issues.createLabel({ owner, repo, ...definition }); else throw e; }
            }

            async function ensureReadyState(issue) {
              const { number, state, title, labels: currentLabels } = issue;
              const normalized = new Set((currentLabels || []).map(l => (l.name || "").toLowerCase()));
              const hasReady = normalized.has(readyLabel);
              const shouldSkip = normalized.has(skipLabel) || /^M(\d+|x)\b/i.test((title || "").trim());
              const isClosed = state !== "open";
              const shouldWithholdReady = normalized.has("agent:working") || normalized.has("agent:blocked") || (await hasOpenLinkedPr(number));

              if ((isClosed || shouldSkip || shouldWithholdReady) && hasReady) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: readyLabel });
              } else if (!isClosed && !shouldSkip && !shouldWithholdReady && !hasReady) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [readyLabel] });
              }
            }

            for (const def of requiredLabels) await ensureLabel(def);

            if (context.eventName === "issues") {
              await ensureReadyState(context.payload.issue);
            } else {
              const openIssues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", per_page: 100 });
              for (const issue of openIssues) { if (!issue.pull_request) await ensureReadyState(issue); }
            }

  agent-close:
    name: Auto-close agent PRs
    if: github.event_name == 'pull_request_target' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, textquest]
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Close agent PRs with agent:close label
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const closeLabel = "agent:close";

            async function closePr(pr) {
              const labels = new Set((pr.labels || []).map(l => (l.name || "").toLowerCase()));
              const isAgentOwned = (pr.head?.ref || "").startsWith("codex/") || (pr.head?.ref || "").startsWith("claude/") || labels.has("codex-automation");
              if (!isAgentOwned || !labels.has(closeLabel) || pr.state !== "open") return;

              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              const marker = "Closing automatically because `agent:close` is set.";
              if (!comments.some(c => c.body?.includes(marker))) {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: `${marker} Remove label and reopen if needed.` });
              }
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: "closed" });
            }

            if (context.eventName === "pull_request_target") {
              await closePr(context.payload.pull_request);
            } else {
              const openPrs = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
              for (const pr of openPrs) await closePr(pr);
            }

  auto-merge:
    name: Enable auto-merge
    if: >
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'merge:auto') && !contains(github.event.pull_request.labels.*.name, 'merge:block')) ||
      (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, textquest]
    permissions:
      pull-requests: write
    steps:
      - name: Enable auto-merge on labeled PRs
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const mergeLabel = "merge:auto";

            async function enableAutoMerge(prNumber) {
              try {
                const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                await github.graphql(`mutation($prId: ID!) { enablePullRequestAutoMerge(input: { pullRequestId: $prId, mergeMethod: MERGE }) { clientMutationId } }`, { prId: pr.data.node_id });
                core.info(`Enabled auto-merge on PR #${prNumber}`);
              } catch (e) { core.warning(`Failed for PR #${prNumber}: ${e.message}`); }
            }

            if (context.eventName === "pull_request") {
              await enableAutoMerge(context.payload.pull_request.number);
            } else {
              const openPrs = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
              for (const pr of openPrs) { if (pr.labels?.some(l => l.name === mergeLabel)) await enableAutoMerge(pr.number); }
            }

  post-merge:
    name: Post-merge sync
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master'
    runs-on: [self-hosted, Linux, X64, textquest]
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Clean labels and sync linked issues
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const prBody = context.payload.pull_request.body || "";

            const labelsToRemove = ["agent:working", "agent:ready", "merge:auto", "agent:blocked"];
            for (const label of labelsToRemove) {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: label }); } catch (_) {}
            }

            const linkedIssues = [...prBody.matchAll(/(?:fix(es)?|close(s)?|resolve(s)?)\s+#(\d+)/gi)].map(m => parseInt(m[3], 10));
            for (const issueNumber of linkedIssues) {
              for (const label of labelsToRemove) {
                try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label }); } catch (_) {}
              }
            }

  sync-wiki:
    name: Sync wiki after merge
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master'
    runs-on: [self-hosted, Windows, X64, textquest]
    permissions:
      contents: write
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Check for docs changes
        id: docs-check
        run: |
          @echo off
          setlocal EnableDelayedExpansion
          set "DOCS_CHANGED=false"
          for /f "usebackq delims=" %%F in (`git diff --name-only HEAD~1`) do (
            set "FILE=%%F"
            if /I "!FILE:~0,5!"=="docs/" set "DOCS_CHANGED=true"
          )
          echo [info] DOCS_CHANGED=!DOCS_CHANGED!
          echo docs_changed=!DOCS_CHANGED!>>"%GITHUB_OUTPUT%"
          exit /b 0
      - name: Setup verified Python
        if: steps.docs-check.outputs.docs_changed == 'true'
        uses: ./.github/actions/setup-verified-python
      - name: Sync wiki after merge
        if: steps.docs-check.outputs.docs_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "%PYTHON_CMD%" scripts/sync_wiki.py --push
