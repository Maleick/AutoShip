name: Copilot CI dispatch

on:
  push:
    branches: [master]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch-blocked-copilot-prs:
    name: Dispatch CI for blocked Copilot PRs
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CI on same-repo Copilot PR heads
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = "ci.yml";
            const copilotLogins = new Set(["app/copilot-swe-agent", "Copilot"]);

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const copilotPrs = openPrs.filter((pr) => {
              const sameRepo = pr.head?.repo?.full_name === `${owner}/${repo}`;
              const copilotAuthor = copilotLogins.has(pr.user?.login);
              const copilotBranch = typeof pr.head?.ref === "string" && pr.head.ref.startsWith("copilot/");
              return sameRepo && (copilotAuthor || copilotBranch);
            });

            const dispatched = [];
            const skipped = [];
            const failed = [];

            for (const pr of copilotPrs) {
              try {
                const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100,
                });
                const touchesWorkflowFiles = changedFiles.some((file) =>
                  file.filename.startsWith(".github/workflows/")
                );

                if (touchesWorkflowFiles) {
                  skipped.push(`#${pr.number} ${pr.head.ref} (workflow changes require manual approval)`);
                  continue;
                }

                const runPage = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflowId,
                  branch: pr.head.ref,
                  per_page: 20,
                });

                const sameShaRuns = (runPage.data.workflow_runs || []).filter(
                  (run) => run.head_sha === pr.head.sha
                );

                const hasActiveRun = sameShaRuns.some((run) =>
                  ["queued", "in_progress", "pending", "requested", "waiting"].includes(run.status)
                );
                const hasAuthoritativeResult = sameShaRuns.some(
                  (run) =>
                    run.status === "completed" &&
                    ["success", "failure", "timed_out", "neutral"].includes(run.conclusion)
                );
                if (hasActiveRun || hasAuthoritativeResult) {
                  skipped.push(
                    `#${pr.number} ${pr.head.ref} (${sameShaRuns[0]?.event || "no-run"} ${sameShaRuns[0]?.status || "no-op"}/${sameShaRuns[0]?.conclusion || "n/a"})`
                  );
                  continue;
                }

                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: workflowId,
                  ref: pr.head.ref,
                });

                const retrySource = sameShaRuns[0]
                  ? `retry after ${sameShaRuns[0].event} ${sameShaRuns[0].status}/${sameShaRuns[0].conclusion || "n/a"}`
                  : "no prior run";
                dispatched.push(`#${pr.number} ${pr.head.ref} @ ${pr.head.sha} (${retrySource})`);
              } catch (error) {
                failed.push(
                  `#${pr.number} ${pr.head.ref} (${error.status || "error"} ${error.message || String(error)})`
                );
              }
            }

            core.summary
              .addHeading("Copilot CI dispatch")
              .addRaw(`Dispatched: ${dispatched.length}\n\n`)
              .addList(dispatched.length ? dispatched : ["None"])
              .addRaw(`\nSkipped: ${skipped.length}\n\n`)
              .addList(skipped.length ? skipped : ["None"])
              .addRaw(`\nFailed: ${failed.length}\n\n`)
              .addList(failed.length ? failed : ["None"])
              .write();
