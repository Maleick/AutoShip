name: Copilot CI dispatch

on:
  push:
    branches: [master]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch-blocked-copilot-prs:
    name: Dispatch CI for blocked Copilot PRs
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CI on same-repo Copilot PR heads
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = "ci.yml";

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const copilotPrs = openPrs.filter((pr) => {
              const sameRepo = pr.head?.repo?.full_name === `${owner}/${repo}`;
              const copilotAuthor = pr.user?.login === "app/copilot-swe-agent";
              const copilotBranch = typeof pr.head?.ref === "string" && pr.head.ref.startsWith("copilot/");
              return sameRepo && (copilotAuthor || copilotBranch);
            });

            const dispatched = [];
            const skipped = [];

            for (const pr of copilotPrs) {
              const runPage = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                branch: pr.head.ref,
                per_page: 20,
              });

              const sameShaRuns = (runPage.data.workflow_runs || []).filter(
                (run) => run.head_sha === pr.head.sha
              );

              const hasActiveRun = sameShaRuns.some((run) =>
                ["queued", "in_progress", "pending", "requested", "waiting"].includes(run.status)
              );
              const hasAuthoritativeResult = sameShaRuns.some(
                (run) =>
                  run.status === "completed" &&
                  ["success", "failure", "timed_out", "neutral"].includes(run.conclusion)
              );
              const blockedForApproval = sameShaRuns.some(
                (run) => run.status === "completed" && run.conclusion === "action_required"
              );

              if (hasActiveRun || hasAuthoritativeResult || (!blockedForApproval && sameShaRuns.length > 0)) {
                skipped.push(
                  `#${pr.number} ${pr.head.ref} (${sameShaRuns[0]?.status || "no-op"}/${sameShaRuns[0]?.conclusion || "n/a"})`
                );
                continue;
              }

              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: workflowId,
                ref: pr.head.ref,
              });

              dispatched.push(`#${pr.number} ${pr.head.ref} @ ${pr.head.sha}`);
            }

            core.summary
              .addHeading("Copilot CI dispatch")
              .addRaw(`Dispatched: ${dispatched.length}\n\n`)
              .addList(dispatched.length ? dispatched : ["None"])
              .addRaw(`\nSkipped: ${skipped.length}\n\n`)
              .addList(skipped.length ? skipped : ["None"])
              .write();
