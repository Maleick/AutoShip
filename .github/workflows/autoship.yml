name: AutoShip

on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan or apply
        required: true
        default: plan
  pull_request:

permissions:
  contents: read

concurrency:
  group: autoship-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'pr' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        shard: [syntax, policy]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt jq
      - name: Run AutoShip shard
        run: |
          if [ "${{ matrix.shard }}" = syntax ]; then
            bash hooks/opencode/check.sh --syntax
          else
            bash hooks/opencode/check.sh --policy
          fi
