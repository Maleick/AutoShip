name: Validate Branch Naming

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        uses: actions/github-script@v6
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const validPatterns = [
              /^feature\/\d+-/,
              /^sub\/\d+\/\d+-/,
              /^bugfix\/\d+-/,
              /^research\/\d+-/,
              /^chore\/\d+-/,
              /^docs\/\d+-/,
            ];
            
            const isValid = validPatterns.some(pattern => pattern.test(branch));
            
            if (!isValid) {
              core.setFailed(
                `Branch name "${branch}" doesn't follow convention.\n` +
                `Expected: feature/123-description, sub/123/456-description, etc.`
              );
            } else {
              console.log(`✅ Branch naming valid: ${branch}`);
            }

      - name: Warn about cleanup branches
        if: contains(github.head_ref, 'wip/') || contains(github.head_ref, 'temp/')
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ WARNING: This branch (${GITHUB_HEAD_REF}) will be auto-deleted after merge.'
            })
