name: README Metrics

on:
  workflow_dispatch:

concurrency:
  group: readme-metrics-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: write

jobs:
  refresh-readme-metrics:
    name: Refresh README metrics
    runs-on: [self-hosted, Windows, X64, dmft]
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate Python
        run: |
          where python >nul 2>nul && (echo PYTHON_CMD=python>>"%GITHUB_ENV%" & exit /b 0)
          where py >nul 2>nul && (echo PYTHON_CMD=py -3>>"%GITHUB_ENV%" & exit /b 0)
          if not exist .ci-python mkdir .ci-python
          set "PYTHON_EMBED_ZIP=.ci-python\python-embed.zip"
          set "PYTHON_EMBED_SHA256=4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3"
          curl.exe -fsSL -o "%PYTHON_EMBED_ZIP%" https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          for /f "tokens=1" %%i in ('certutil -hashfile "%PYTHON_EMBED_ZIP%" SHA256 ^| findstr /R /I "^[0-9A-F][0-9A-F]*$"') do set "DOWNLOADED_PYTHON_SHA256=%%i"
          if /I not "%DOWNLOADED_PYTHON_SHA256%"=="%PYTHON_EMBED_SHA256%" (
            echo [fatal] Python embed archive checksum mismatch.
            exit /b 1
          )
          tar -xf "%PYTHON_EMBED_ZIP%" -C .ci-python
          echo PYTHON_CMD=%CD%\.ci-python\python.exe>>"%GITHUB_ENV%"

      - name: Provision nightly toolchain via rustup
        env:
          NIGHTLY_TOOLCHAIN: nightly-x86_64-pc-windows-msvc
        run: |
          if not defined CARGO_HOME set "CARGO_HOME=%USERPROFILE%\.cargo"
          if not defined RUSTUP_HOME set "RUSTUP_HOME=%USERPROFILE%\.rustup"
          set "PATH=%CARGO_HOME%\bin;%PATH%"
          echo [info] Ensuring Rust toolchain %NIGHTLY_TOOLCHAIN% is available on this runner.
          where rustup.exe >nul 2>nul || (
            echo [warn] rustup.exe not found in PATH. Installing rustup bootstrap.
            curl.exe -fSLo "%TEMP%\rustup-init.exe" https://win.rustup.rs/x86_64
            start /wait "" "%TEMP%\rustup-init.exe" -y --no-modify-path --default-toolchain %NIGHTLY_TOOLCHAIN%
            if errorlevel 1 (
              echo [fatal] rustup bootstrap failed.
              exit /b 1
            )
            del /f /q "%TEMP%\rustup-init.exe"
          )
          where rustup.exe >nul 2>nul || (
            echo [fatal] rustup.exe still not available after bootstrap.
            exit /b 1
          )
          echo %CARGO_HOME%\bin>>%GITHUB_PATH%
          rustup --version
          rustup toolchain install %NIGHTLY_TOOLCHAIN% --no-self-update
          rustup default %NIGHTLY_TOOLCHAIN%
          rustup run %NIGHTLY_TOOLCHAIN% rustc -V
          rustup run %NIGHTLY_TOOLCHAIN% rustc -V | findstr /i "nightly" >nul || (
            echo [fatal] rustc for %NIGHTLY_TOOLCHAIN% is not reporting a nightly compiler.
            exit /b 1
          )
          echo [info] Nightly compiler confirmed for %NIGHTLY_TOOLCHAIN%.

      - name: Update README metrics
        run: '%PYTHON_CMD% scripts/update_readme_metrics.py'

      - name: Decide whether this ref can be updated directly
        run: |
          if /I "%GITHUB_REF_NAME%"=="master" (
            echo CAN_PUSH=false>>"%GITHUB_ENV%"
            echo [notice] master is protected. Run README Metrics on a topic branch and merge it via PR.
          ) else (
            echo CAN_PUSH=true>>"%GITHUB_ENV%"
          )

      - name: Commit updated README metrics
        if: env.CAN_PUSH == 'true'
        run: |
          git diff --quiet -- README.md && exit /b 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): refresh project metrics"
          git push

      - name: Report skipped protected-branch update
        if: env.CAN_PUSH != 'true'
        run: |
          git diff --quiet -- README.md && exit /b 0
          echo [notice] README metrics changed, but this workflow will not push directly to protected master. Re-run it on a topic branch and merge that PR.
