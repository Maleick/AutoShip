name: README Metrics

on:
  workflow_dispatch:

concurrency:
  group: readme-metrics-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: write

jobs:
  refresh-readme-metrics:
    name: Refresh README metrics
    runs-on: [self-hosted, Windows, X64, dmft]
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate Python
        run: |
          where python >nul 2>nul && (echo PYTHON_CMD=python>>"%GITHUB_ENV%" & exit /b 0)
          where py >nul 2>nul && (echo PYTHON_CMD=py -3>>"%GITHUB_ENV%" & exit /b 0)
          if not exist .ci-python mkdir .ci-python
          curl.exe -fsSL -o .ci-python\python-embed.zip https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          tar -xf .ci-python\python-embed.zip -C .ci-python
          echo PYTHON_CMD=%CD%\.ci-python\python.exe>>"%GITHUB_ENV%"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Update README metrics
        run: '%PYTHON_CMD% scripts/update_readme_metrics.py'

      - name: Commit updated README metrics
        run: |
          git diff --quiet -- README.md && exit /b 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): refresh project metrics"
          git push
