name: README Metrics

on:
  workflow_dispatch:

concurrency:
  group: readme-metrics-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: write

jobs:
  refresh-readme-metrics:
    name: Refresh README metrics
    runs-on: [self-hosted, Windows, X64, dmft]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate Python
        run: |
          $python = (Get-Command python -ErrorAction SilentlyContinue)
          if ($python) {
            "PYTHON_CMD=python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }

          $py = (Get-Command py -ErrorAction SilentlyContinue)
          if ($py) {
            "PYTHON_CMD=py -3" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }

          throw "Python 3 is not installed on the Windows runner."

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Update README metrics
        run: |
          Invoke-Expression "$env:PYTHON_CMD scripts/update_readme_metrics.py"

      - name: Commit updated README metrics
        run: |
          git diff --quiet -- README.md
          if ($LASTEXITCODE -eq 0) {
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): refresh project metrics"
          git push
