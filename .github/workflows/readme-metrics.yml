name: README Metrics

on:
  schedule:
    - cron: "30 7 * * 0"
  workflow_dispatch:

concurrency:
  group: readme-metrics-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: write

jobs:
  refresh-readme-metrics:
    name: Refresh README metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Update README metrics
        run: python3 scripts/update_readme_metrics.py

      - name: Commit updated README metrics
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): refresh project metrics"
          git push
