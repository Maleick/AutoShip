name: README Metrics

on:
  workflow_dispatch:

concurrency:
  group: readme-metrics-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: write

jobs:
  refresh-readme-metrics:
    name: Refresh README metrics
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Update README metrics
        run: python scripts/update_readme_metrics.py

      - name: Commit updated README metrics
        run: |
          git diff --quiet -- README.md
          if ($LASTEXITCODE -eq 0) {
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): refresh project metrics"
          git push
