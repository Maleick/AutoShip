name: README Metrics

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: readme-metrics-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-readme-metrics:
    name: Refresh README metrics
    runs-on: [self-hosted, Windows, X64, textquest]
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup verified Python
        uses: ./.github/actions/setup-verified-python

      - name: Provision nightly toolchain via rustup
        env:
          NIGHTLY_TOOLCHAIN: nightly-x86_64-pc-windows-msvc
        run: |
          if not defined CARGO_HOME set "CARGO_HOME=%USERPROFILE%\.cargo"
          if not defined RUSTUP_HOME set "RUSTUP_HOME=%USERPROFILE%\.rustup"
          set "PATH=%CARGO_HOME%\bin;%PATH%"
          echo [info] Ensuring Rust toolchain %NIGHTLY_TOOLCHAIN% is available on this runner.
          where rustup.exe >nul 2>nul || (
            echo [fatal] rustup.exe not found in PATH. Install rustup on this runner before running this workflow.
            exit /b 1
          )
          echo %CARGO_HOME%\bin>>%GITHUB_PATH%
          rustup --version
          rustup toolchain install %NIGHTLY_TOOLCHAIN% --no-self-update
          rustup default %NIGHTLY_TOOLCHAIN%
          rustup run %NIGHTLY_TOOLCHAIN% rustc -V
          rustup run %NIGHTLY_TOOLCHAIN% rustc -V | findstr /i "nightly" >nul || (
            echo [fatal] rustc for %NIGHTLY_TOOLCHAIN% is not reporting a nightly compiler.
            exit /b 1
          )
          echo [info] Nightly compiler confirmed for %NIGHTLY_TOOLCHAIN%.

      - name: Update README metrics
        run: "%PYTHON_CMD% scripts/update_readme_metrics.py"

      - name: Commit and push or open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          setlocal EnableDelayedExpansion
          git diff --quiet -- README.md && (
            echo [info] No changes to README.md — exiting early.
            exit /b 0
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if /I "%GITHUB_REF_NAME%"=="master" (
            echo [info] Updating stable topic branch for README metrics.
            set "BRANCH_NAME=chore/readme-metrics"
            
            git fetch origin !BRANCH_NAME! 2>nul
            git checkout -B !BRANCH_NAME! origin/master
            
            git add README.md
            git commit -m "chore(readme): refresh project metrics"
            git push origin !BRANCH_NAME! --force-with-lease
            
            echo [info] Checking for existing PR.
            set "PR_EXISTS="
            for /f "tokens=*" %%P in ('gh pr list --head !BRANCH_NAME! --json number --jq ".[].number"') do set "PR_EXISTS=%%P"
            if "!PR_EXISTS!"=="" (
              echo [info] Opening new pull request.
              gh pr create --title "chore(readme): refresh project metrics" --body "Automated README metrics refresh via GitHub Actions." --head !BRANCH_NAME! --base master --label "merge:auto"
            ) else (
              echo [info] Pull request #!PR_EXISTS! already exists.
            )
          ) else (
            echo [info] Pushing metrics update directly to topic branch.
            git add README.md
            git commit -m "chore(readme): refresh project metrics"
            git push
          )
