name: README Metrics

on:
  workflow_dispatch:

concurrency:
  group: readme-metrics-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: write

jobs:
  refresh-readme-metrics:
    name: Refresh README metrics
    runs-on: [self-hosted, Windows, X64, dmft]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate Python
        run: |
          if command -v python >/dev/null 2>&1; then
            echo "PYTHON_CMD=python" >> "$GITHUB_ENV"
            exit 0
          fi
          if command -v py >/dev/null 2>&1; then
            echo "PYTHON_CMD=py -3" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Python 3 is not installed on the Windows runner." >&2
          exit 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Update README metrics
        run: $PYTHON_CMD scripts/update_readme_metrics.py

      - name: Commit updated README metrics
        run: |
          git diff --quiet -- README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): refresh project metrics"
          git push
