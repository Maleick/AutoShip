name: Validate PR

on:
  pull_request:
    types: [opened, synchronize, edited]

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-naming:
    name: Validate branch naming
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        uses: actions/github-script@v6
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const validPatterns = [
              /^feature\/\d+-/,
              /^sub\/\d+\/\d+-/,
              /^bugfix\/\d+-/,
              /^research\/\d+-/,
              /^chore\//,
              /^docs\/\d+-/,
              /^autoship\//,
              /^fix\//,
              /^refactor\//,
              /^ci\//,
              /^test\//,
            ];

            const isValid = validPatterns.some(pattern => pattern.test(branch));

            if (!isValid) {
              core.setFailed(
                `Branch name "${branch}" doesn't follow convention.\n` +
                `Expected: feature/123-description, fix/..., autoship/issue-N, chore/..., etc.`
              );
            } else {
              console.log(`Branch naming valid: ${branch}`);
            }

  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v5
        with:
          configFile: .commitlintrc.json

  pr-title:
    name: Validate PR title format
    runs-on: ubuntu-latest
    steps:
      - name: Validate conventional commit format
        uses: amannn/action-semantic-pull-request@e9fabac35e210fea40ca5b14c0da95a099eff26f # v5.4.0
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
          requireScope: false
          validateSingleCommit: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
