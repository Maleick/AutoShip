name: Auto-merge labeled PRs

on:
  pull_request:
    types: [labeled, synchronize]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >
      (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'merge:auto') &&
        !contains(github.event.pull_request.labels.*.name, 'merge:block')
      ) ||
      (
        github.event_name == 'check_suite' &&
        github.event.check_suite.conclusion == 'success'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: [self-hosted, Windows, X64, textquest]
    steps:
      - name: Enable auto-merge on labeled PRs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const mergeLabel = "merge:auto";

            async function enableAutoMerge(prNumber) {
              try {
                const result = await github.graphql(`
                  mutation($prId: ID!) {
                    enablePullRequestAutoMerge(input: { pullRequestId: $prId, mergeMethod: MERGE }) {
                      clientMutationId
                    }
                  }
                `, {
                  prId: (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data.node_id,
                });
                core.info(`Enabled auto-merge on PR #${prNumber}`);
              } catch (error) {
                core.warning(`Failed to enable auto-merge on PR #${prNumber}: ${error.message}`);
              }
            }

            if (context.eventName === "pull_request") {
              await enableAutoMerge(context.payload.pull_request.number);
              return;
            }

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            for (const pr of openPrs) {
              const labels = (pr.labels || []).map((l) => l.name);
              if (labels.includes(mergeLabel)) {
                await enableAutoMerge(pr.number);
              }
            }
