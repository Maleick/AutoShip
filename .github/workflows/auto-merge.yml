name: Auto-merge labeled PRs

on:
  pull_request:
    types: [labeled, synchronize]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'merge:auto'))
      ||
      (github.event_name == 'check_suite' &&
       github.event.check_suite.conclusion == 'success')
      ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge on labeled PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr_number="${{ github.event.pull_request.number }}"
            echo "Enabling auto-merge on PR #${pr_number}"
            gh pr merge "$pr_number" --repo "${{ github.repository }}" --auto --merge || true
            exit 0
          fi

          prs=$(gh pr list --repo "${{ github.repository }}" --state open \
            --label "merge:auto" --json number --jq '.[].number')
          if [ -z "$prs" ]; then
            echo "No open merge:auto PRs."
            exit 0
          fi
          for pr in $prs; do
            echo "Enabling auto-merge on PR #${pr}"
            gh pr merge "$pr" --repo "${{ github.repository }}" --auto --merge || true
          done
