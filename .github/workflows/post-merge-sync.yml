name: Post-merge project sync

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-project:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Update linked issues and clean labels
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const prBody = context.payload.pull_request.body || "";

            core.info(`PR #${prNumber} merged into ${context.payload.pull_request.base.ref}`);

            const prLabelsToRemove = ["agent:working", "agent:ready", "merge:auto"];
            for (const label of prLabelsToRemove) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: label });
              } catch (_) { /* label may not exist */ }
            }

            const linkedPattern = /(?:fix(?:es)?|close(?:s)?|resolve(?:s)?)\s+#(\d+)/gi;
            const linkedIssues = new Set();
            let match;
            while ((match = linkedPattern.exec(prBody)) !== null) {
              linkedIssues.add(parseInt(match[1], 10));
            }

            if (linkedIssues.size === 0) {
              core.info("No linked issues found in PR body.");
              return;
            }

            const issueLabelsToRemove = ["agent:working", "agent:ready", "agent:blocked"];
            for (const issueNumber of linkedIssues) {
              core.info(`Cleaning labels on issue #${issueNumber}`);
              for (const label of issueLabelsToRemove) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label });
                } catch (_) { /* label may not exist */ }
              }
            }

  sync-wiki:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master'
    runs-on: [self-hosted, Windows, X64, textquest]
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for docs changes
        id: docs-check
        shell: bash
        run: |
          if git diff HEAD~1 --name-only | grep -qE '^docs/'; then
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
            echo "No docs changes — skipping wiki sync"
          fi

      - name: Locate or provision verified Python
        if: steps.docs-check.outputs.docs_changed == 'true'
        env:
          PYTHON_EMBED_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          PYTHON_EMBED_SHA256: 4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3
        run: |
          where python >nul 2>nul && (
            echo PYTHON_CMD=python>>"%GITHUB_ENV%"
            python --version
            exit /b 0
          )
          where py >nul 2>nul && (
            echo PYTHON_CMD=py -3>>"%GITHUB_ENV%"
            py -3 --version
            exit /b 0
          )
          setlocal EnableDelayedExpansion
          if exist .ci-python rmdir /s /q .ci-python
          mkdir .ci-python
          curl.exe -fsSL -o .ci-python\python-embed.zip "%PYTHON_EMBED_URL%"
          for /f "tokens=* delims=" %%H in ('certutil -hashfile ".ci-python\python-embed.zip" SHA256 ^| findstr /r /v /c:"^SHA256" /c:"^CertUtil" /c:"^$"') do (
            set "PYTHON_EMBED_ACTUAL_SHA256=%%H"
          )
          set "PYTHON_EMBED_ACTUAL_SHA256=!PYTHON_EMBED_ACTUAL_SHA256: =!"
          if /I not "!PYTHON_EMBED_ACTUAL_SHA256!"=="%PYTHON_EMBED_SHA256%" (
            echo [fatal] Verified Python download checksum mismatch.
            echo [fatal] Expected: %PYTHON_EMBED_SHA256%
            echo [fatal] Actual:   !PYTHON_EMBED_ACTUAL_SHA256!
            exit /b 1
          )
          tar -xf .ci-python\python-embed.zip -C .ci-python
          if not exist .ci-python\python.exe (
            echo [fatal] Extracted python.exe not found after verified download.
            exit /b 1
          )
          endlocal & (
            echo PYTHON_CMD=%CD%\.ci-python\python.exe>>"%GITHUB_ENV%"
          )
          "%CD%\.ci-python\python.exe" --version

      - name: Sync wiki after merge
        if: steps.docs-check.outputs.docs_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Docs changed — syncing wiki"
          %PYTHON_CMD% scripts/sync_wiki.py --push
