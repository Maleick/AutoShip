name: Claude agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]

concurrency:
  group: claude-agent-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    if: |
      github.actor != 'Copilot' &&
      (
        (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'worker:claude')) ||
        (
          (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
          contains(github.event.comment.body, '@claude') &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        )
      )
    runs-on: [self-hosted, Linux, X64, textquest]
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || github.event_name == 'pull_request_review_comment' && format('refs/pull/{0}/head', github.event.pull_request.number) || '' }}

      - name: Run Claude agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: Copilot
          prompt: |
            Follow `docs/claude-issue-worker.md` exactly.
            Read `AGENTS.md` and `CLAUDE.md` before editing.
            In TextQuest, Claude may claim issues, implement changes, run verification, and open pull requests, but must never merge or enable merge.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 12
            --append-system-prompt "Read AGENTS.md and CLAUDE.md before editing. In TextQuest, Claude may claim issues, implement changes, run verification, and open pull requests, but must never merge or enable merge."
