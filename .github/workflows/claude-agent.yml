name: Claude agent issue worker

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, reopened, labeled]

concurrency:
  group: claude-agent-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'worker:claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude issue worker
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Follow `docs/claude-issue-worker.md` exactly.
            Read `AGENTS.md` and `CLAUDE.md` before editing.
            In DMFT, Claude may claim issues, implement changes, run verification, and open pull requests, but must never merge or enable merge.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 12
            --append-system-prompt "Read AGENTS.md and CLAUDE.md before editing. In DMFT, Claude may claim issues, implement changes, run verification, and open pull requests, but must never merge or enable merge."
