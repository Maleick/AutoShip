name: Auto Branch Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete_branch:
    name: Delete branch after merge
    runs-on: [self-hosted, Linux, X64, textquest]
    if: github.event.pull_request.merged == true
    steps:
      - name: Delete merged branch
        uses: dawidd6/action-delete-branch@d1efac9a6f7a9b408d4e8ff663a99c1fbac17b3f # v3
        with:
          github_token: ${{ github.token }}
          branches: ${{ github.event.pull_request.head.ref }}
          delete_orphaned_branches: false
