name: Branch Cleanup

on:
  schedule:
    # Run weekly on Sundays at 3:00 AM UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run mode — list branches that would be deleted without deleting them"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

env:
  # Set BRANCH_CLEANUP_DRY_RUN=true to enable dry-run mode via env var
  # workflow_dispatch input overrides this when set to 'true'
  BRANCH_CLEANUP_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

jobs:
  cleanup:
    name: Delete merged branches
    runs-on: [self-hosted, Linux, X64, textquest]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cleanup merged branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DRY_RUN="${BRANCH_CLEANUP_DRY_RUN}"
          REPO="${{ github.repository }}"
          TIMESTAMP="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          echo "=== Branch Cleanup Audit Log ==="
          echo "Timestamp: ${TIMESTAMP}"
          echo "Repository: ${REPO}"
          echo "Dry-run mode: ${DRY_RUN}"
          echo "================================"

          # Protected branch patterns — never delete these
          PROTECTED_PATTERNS="^(master|main|develop)$|^feature/"

          # Fetch all remote branches
          git fetch --prune origin

          DELETED=0
          SKIPPED=0
          FAILED=0
          NOT_FOUND=0

          # Get list of merged branches from GitHub API (merged PRs only)
          MERGED_BRANCHES=$(gh api \
            "repos/${REPO}/pulls?state=closed&per_page=100" \
            --jq '.[] | select(.merged_at != null) | .head.ref' \
            2>/dev/null || true)

          if [ -z "${MERGED_BRANCHES}" ]; then
            echo "[${TIMESTAMP}] INFO: No merged pull request branches found."
          fi

          while IFS= read -r branch; do
            [ -z "${branch}" ] && continue

            TS="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            # Skip protected branches
            if echo "${branch}" | grep -qE "${PROTECTED_PATTERNS}"; then
              echo "[${TS}] SKIP protected: ${branch}"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # Check if branch still exists on remote
            if ! git ls-remote --exit-code --heads origin "${branch}" > /dev/null 2>&1; then
              echo "[${TS}] NOT_FOUND (already deleted): ${branch}"
              NOT_FOUND=$((NOT_FOUND + 1))
              continue
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              echo "[${TS}] DRY-RUN would delete: ${branch}"
              DELETED=$((DELETED + 1))
            else
              # Attempt deletion; handle 404 / already-gone gracefully
              HTTP_STATUS=$(gh api \
                --method DELETE \
                --silent \
                -H "Accept: application/vnd.github+json" \
                "repos/${REPO}/git/refs/heads/${branch}" \
                --include 2>&1 | grep -m1 "^HTTP/" | awk '{print $2}' || echo "0")

              if [ "${HTTP_STATUS}" = "204" ] || [ "${HTTP_STATUS}" = "0" ]; then
                # 0 means gh swallowed the header; try a simpler push delete as fallback
                git push origin --delete "${branch}" 2>/dev/null && {
                  echo "[${TS}] DELETED: ${branch}"
                  DELETED=$((DELETED + 1))
                } || {
                  echo "[${TS}] NOT_FOUND (deleted between check and delete): ${branch}"
                  NOT_FOUND=$((NOT_FOUND + 1))
                }
              elif [ "${HTTP_STATUS}" = "404" ] || [ "${HTTP_STATUS}" = "422" ]; then
                echo "[${TS}] NOT_FOUND (404/422 — already deleted): ${branch}"
                NOT_FOUND=$((NOT_FOUND + 1))
              else
                echo "[${TS}] FAILED (HTTP ${HTTP_STATUS}): ${branch}"
                FAILED=$((FAILED + 1))
              fi
            fi
          done <<< "${MERGED_BRANCHES}"

          echo ""
          echo "=== Summary ==="
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Mode: DRY-RUN (no branches were actually deleted)"
            echo "Would delete: ${DELETED}"
          else
            echo "Mode: LIVE"
            echo "Deleted:      ${DELETED}"
          fi
          echo "Skipped (protected): ${SKIPPED}"
          echo "Not found (already gone): ${NOT_FOUND}"
          echo "Failed:       ${FAILED}"
          echo "==============="

          if [ "${FAILED}" -gt 0 ]; then
            echo "::warning::${FAILED} branch deletion(s) failed. Check logs above."
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIMESTAMP="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "[${TIMESTAMP}] ERROR: Branch cleanup workflow failed."
          echo "::error::Branch cleanup encountered failures. Review the audit log above."
          # Create a GitHub issue comment or annotation — the ::error:: annotation
          # is surfaced in the Actions UI and will trigger any configured
          # workflow failure notifications (email, Slack, etc.).
