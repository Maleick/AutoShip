name: Branch Cleanup

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run cleanup in dry-run mode (no deletions)'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  delete-merged-branches:
    name: Delete merged feature branches
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, textquest]
    outputs:
      deleted_count: ${{ steps.cleanup.outputs.deleted_count }}
      skipped_count: ${{ steps.cleanup.outputs.skipped_count }}
    steps:
      - name: Delete merged branch
        id: cleanup
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.pull_request.head.ref;
            const prNumber = context.payload.pull_request.number;
            let deleted = 0;
            let skipped = 0;

            // Guard against fork PR deletion of same-named local branches
            const headRepoFullName = context.payload.pull_request.head.repo?.full_name;
            const baseRepoFullName = `${owner}/${repo}`;
            if (headRepoFullName !== baseRepoFullName) {
              core.info(`⊘ Skipped fork PR branch: ${ref} (from ${headRepoFullName})`);
              skipped++;
              core.setOutput('deleted_count', deleted.toString());
              core.setOutput('skipped_count', skipped.toString());
              return;
            }

            // Skip protected branches and default branch
            const skipBranches = ['master', 'main', 'develop', 'development'];
            if (skipBranches.includes(ref)) {
              core.info(`⊘ Skipped protected branch: ${ref}`);
              skipped++;
              core.setOutput('deleted_count', deleted.toString());
              core.setOutput('skipped_count', skipped.toString());
              return;
            }

            // Skip non-feature branches (releases, hotfixes, etc.)
            if (!ref.startsWith('claude/') && !ref.startsWith('codex/') && !ref.startsWith('feature/')) {
              core.info(`⊘ Skipped non-feature branch: ${ref}`);
              skipped++;
              core.setOutput('deleted_count', deleted.toString());
              core.setOutput('skipped_count', skipped.toString());
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${ref}`
              });
              deleted++;
              core.info(`✓ Deleted branch: ${ref}`);

              // Add comment to PR
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `🧹 Branch cleanup: Deleted \`${ref}\` after merge.`
              });
            } catch (error) {
              if (error.status === 404) {
                core.info(`⊘ Branch already deleted: ${ref}`);
              } else {
                core.error(`✗ Failed to delete ${ref}: ${error.message}`);
                throw error;
              }
            }

            core.setOutput('deleted_count', deleted.toString());
            core.setOutput('skipped_count', skipped.toString());

      - name: Cleanup all stale merged branches
        id: stale-cleanup
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const dryRun = "${{ github.event.inputs.dry_run }}" === 'true';

            // Get all branches
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });

            const skipBranches = ['master', 'main', 'develop', 'development'];
            let deleted = 0;
            let skipped = 0;
            let failed = 0;
            const deleteLog = [];

            for (const branch of branches) {
              const name = branch.name;

              // Skip protected and non-feature branches
              if (skipBranches.includes(name) ||
                  (!name.startsWith('claude/') &&
                   !name.startsWith('codex/') &&
                   !name.startsWith('feature/'))) {
                skipped++;
                continue;
              }

              // Check if branch is merged into default branch
              try {
                const defaultBranch = context.payload.repository.default_branch;
                const compare = await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: defaultBranch,
                  head: name
                });

                // Check if branch is merged
                // Only delete if:
                // - Branches are identical, OR
                // - Feature branch has no commits ahead (no unmerged work)
                // Note: Squash/rebase merged branches won't be detected here (ahead_by > 0)
                // but will be caught by GitHub's "auto delete head branch" PR setting
                if (compare.data.status === 'identical' || compare.data.ahead_by === 0) {
                  if (dryRun) {
                    core.info(`[DRY-RUN] Would delete merged branch: ${name}`);
                    deleteLog.push(`${name} (merged)`);
                  } else {
                    try {
                      await github.rest.git.deleteRef({
                        owner,
                        repo,
                        ref: `heads/${name}`
                      });
                      deleted++;
                      core.info(`✓ Deleted merged branch: ${name}`);
                      deleteLog.push(`${name} (deleted)`);
                    } catch (deleteError) {
                      if (deleteError.status === 404) {
                        core.debug(`Branch already deleted: ${name}`);
                      } else {
                        core.warning(`Failed to delete ${name}: ${deleteError.message}`);
                        failed++;
                        deleteLog.push(`${name} (failed: ${deleteError.message})`);
                      }
                    }
                  }
                } else {
                  skipped++;
                }
              } catch (compareError) {
                core.debug(`Could not check ${name}: ${compareError.message}`);
                failed++;
              }
            }

            const summary = `Cleanup ${dryRun ? '(DRY-RUN)' : ''}: ${deleted} deleted, ${skipped} skipped, ${failed} failed`;
            core.notice(summary);
            core.setOutput('deleted_count', deleted.toString());
            core.setOutput('skipped_count', skipped.toString());
