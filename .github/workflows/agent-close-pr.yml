name: Auto-close agent PRs

on:
  pull_request_target:
    types: [labeled, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  close-labeled-agent-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Close agent PRs marked for automation close
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const closeLabel = "agent:close";

            async function ensureCloseLabel() {
              try {
                await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: closeLabel,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: closeLabel,
                  color: "B60205",
                  description: "Close this agent-authored pull request automatically.",
                });
              }
            }

            function isAgentOwned(pr) {
              const labels = new Set((pr.labels || []).map((label) => (label.name || "").toLowerCase()));
              // `codex-automation` is a literal PR label used by automation-opened agent PRs.
              return (
                (pr.head && typeof pr.head.ref === "string" && (pr.head.ref.startsWith("codex/") || pr.head.ref.startsWith("claude/"))) ||
                labels.has("codex-automation")
              );
            }

            function shouldClose(pr) {
              const labels = new Set((pr.labels || []).map((label) => (label.name || "").toLowerCase()));
              return labels.has(closeLabel);
            }

            async function closePr(pr) {
              if (!isAgentOwned(pr) || !shouldClose(pr) || pr.state !== "open") {
                return;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const marker = "Closing automatically because `agent:close` is set.";
              if (!comments.some((comment) => comment.body && comment.body.includes(marker))) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: `${marker} Remove the label and reopen the PR if it should re-enter the queue.`,
                });
              }

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                state: "closed",
              });
            }

            await ensureCloseLabel();

            if (context.eventName === "pull_request_target") {
              await closePr(context.payload.pull_request);
              return;
            }

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            for (const pr of openPrs) {
              await closePr(pr);
            }
