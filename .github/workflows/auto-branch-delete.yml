name: Auto Branch Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete merged branch
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          PROTECTED="master main develop"
          if echo "$PROTECTED" | grep -qw "$BRANCH"; then
            echo "Skipping protected branch: $BRANCH"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/git/refs/heads/${BRANCH}" \
            --method DELETE 2>/dev/null \
            && echo "Deleted $BRANCH" \
            || echo "Branch $BRANCH already gone — skipping"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
