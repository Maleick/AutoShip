name: Super-Linter

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: super-linter-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  super-linter:
    name: Super-Linter
    runs-on: [self-hosted, Linux, X64, textquest]
    timeout-minutes: 30
    steps:
      - name: Prepare Linux self-hosted workspace
        uses: ./.github/actions/prepare-linux-runner-workspace

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: super-linter/super-linter@v8.6.0
        env:
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
