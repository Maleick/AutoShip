name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows release
    runs-on: [self-hosted, Windows, X64, dmft]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - name: Initialize reference submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: lukka/get-cmake@v4

      - name: Build release binaries
        run: cargo build --release
        env:
          LIBCLANG_PATH: "C:/Program Files/LLVM/lib"

      - name: Package artifacts
        run: |
          if not exist release mkdir release
          copy /Y target\release\dmft.exe release\dmft.exe
          if exist target\release\dmft_dll.dll copy /Y target\release\dmft_dll.dll release\dmft_dll.dll
          > release\VERSION.txt <nul set /p =DMFT ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
