name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false


env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows release
    runs-on: [self-hosted, Windows, X64, textquest]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git safe directories
        uses: ./.github/actions/configure-safe-directory

      - name: Initialize reference submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Setup Rust nightly
        uses: ./.github/actions/setup-rust-nightly

      - name: Ensure cmake on PATH
        uses: ./.github/actions/ensure-cmake

      - name: Run tests before release
        run: |
          echo [info] Running test suite...
          cargo test --lib --all
          echo [info] All tests passed.

      - name: Build release binaries
        run: cargo build --release
        env:
          LIBCLANG_PATH: "C:/Program Files/LLVM/lib"

      - name: Verify release outputs
        run: |
          if not exist target\release\textquest.exe (
            echo [fatal] target\release\textquest.exe missing after cargo build.
            exit /b 1
          )
          if not exist target\release\textquest_dll.dll (
            echo [fatal] target\release\textquest_dll.dll missing after cargo build.
            exit /b 1
          )
          echo [info] Release artifact check passed.

      - name: Package artifacts
        run: |
          if not exist release mkdir release
          copy /Y target\release\textquest.exe release\textquest.exe
          if exist target\release\textquest_dll.dll copy /Y target\release\textquest_dll.dll release\textquest_dll.dll

      - name: Write release version file
        shell: pwsh
        run: Set-Content -Path release/VERSION.txt -NoNewline -Value ("TextQuest " + $env:GITHUB_REF_NAME)

      - name: Extract changelog excerpt
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $changelogPath = "CHANGELOG.md"

          # Extract changelog for this version
          if (Test-Path $changelogPath) {
            $content = Get-Content $changelogPath -Raw

            # Match the version section: ## [X.Y.Z] - DATE ... until next ## or end of file
            $pattern = "## \[$([regex]::Escape($version))\].*?(?=(## \[|\Z))"

            if ($content -match $pattern) {
              $excerpt = $matches[0] -replace '## \[' , '## [' # cleanup
              $excerpt = $excerpt.Trim()
              Set-Content -Path release/CHANGELOG_EXCERPT.txt -Value $excerpt
              Write-Host "Extracted changelog for v$version"
              Write-Host $excerpt
            } else {
              Write-Host "Warning: Could not extract changelog for version $version from CHANGELOG.md"
            }
          } else {
            Write-Host "Warning: CHANGELOG.md not found"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
