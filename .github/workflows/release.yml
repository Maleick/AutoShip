name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows release
    runs-on: [self-hosted, Windows, X64, dmft]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - name: Initialize reference submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Provision nightly toolchain via rustup
        env:
          NIGHTLY_TOOLCHAIN: nightly-x86_64-pc-windows-msvc
        run: |
          if not defined CARGO_HOME set "CARGO_HOME=%USERPROFILE%\.cargo"
          if not defined RUSTUP_HOME set "RUSTUP_HOME=%USERPROFILE%\.rustup"
          set "PATH=%CARGO_HOME%\bin;%PATH%"
          echo [info] Ensuring Rust toolchain %NIGHTLY_TOOLCHAIN% is available on this runner.
          where rustup.exe >nul 2>nul || (
            echo [warn] rustup.exe not found in PATH. Installing rustup bootstrap.
            curl.exe -fSLo "%TEMP%\rustup-init.exe" https://win.rustup.rs/x86_64
            start /wait "" "%TEMP%\rustup-init.exe" -y --no-modify-path --default-toolchain %NIGHTLY_TOOLCHAIN%
            if errorlevel 1 (
              echo [fatal] rustup bootstrap failed.
              exit /b 1
            )
            del /f /q "%TEMP%\rustup-init.exe"
          )

          where rustup.exe >nul 2>nul || (
            echo [fatal] rustup.exe still not available after bootstrap.
            exit /b 1
          )
          echo %CARGO_HOME%\bin>>%GITHUB_PATH%
          echo [info] rustup version:
          rustup --version
          rustup show
          rustup toolchain install %NIGHTLY_TOOLCHAIN% --no-self-update
          rustup default %NIGHTLY_TOOLCHAIN%
          rustup component add rustfmt clippy --toolchain %NIGHTLY_TOOLCHAIN%
          rustup run %NIGHTLY_TOOLCHAIN% rustc -V | findstr /i "nightly" >nul || (
            echo [fatal] rustc for %NIGHTLY_TOOLCHAIN% is not reporting a nightly compiler.
            exit /b 1
          )

      - name: Ensure cmake on PATH
        shell: pwsh
        run: |
          if (Get-Command cmake -ErrorAction SilentlyContinue) {
            Write-Host "[info] cmake already on PATH: $(cmake --version | Select-Object -First 1)"
            exit 0
          }
          $candidates = @(
            'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin',
            'C:\Program Files\Microsoft Visual Studio\2022\BuildTools\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin',
            'C:\Program Files (x86)\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin',
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin',
            'C:\Program Files\CMake\bin'
          )
          foreach ($dir in $candidates) {
            if (Test-Path (Join-Path $dir 'cmake.exe')) {
              Write-Host "[info] Found cmake at $dir"
              Add-Content $env:GITHUB_PATH $dir
              $env:PATH = "${dir};${env:PATH}"
              cmake --version
              if ($LASTEXITCODE -ne 0) { Write-Error "[fatal] cmake sanity check failed at $dir"; exit 1 }
              exit 0
            }
          }
          Write-Host "[info] cmake not found in well-known paths; installing via winget..."
          winget install --id Kitware.CMake -e --source winget --accept-package-agreements --accept-source-agreements --silent
          if ($LASTEXITCODE -ne 0) { Write-Error "[fatal] winget cmake install failed"; exit 1 }
          $installPath = 'C:\Program Files\CMake\bin'
          Add-Content $env:GITHUB_PATH $installPath
          $env:PATH = "${installPath};${env:PATH}"
          cmake --version
          if ($LASTEXITCODE -ne 0) { Write-Error "[fatal] cmake not available after install"; exit 1 }

      - name: Nightly compiler sanity check
        run: |
          echo [info] Verifying required nightly compiler for release path.
          rustc -V
          rustc -V | findstr /i "nightly" >nul
          if errorlevel 1 (
            echo [fatal] Release workflow requires nightly toolchain but rustc is not reporting nightly.
            exit /b 1
          )
          cargo --version

      - name: Build release binaries
        run: cargo build --release
        env:
          LIBCLANG_PATH: "C:/Program Files/LLVM/lib"

      - name: Verify release outputs
        run: |
          if not exist target\release\dmft.exe (
            echo [fatal] target\release\dmft.exe missing after cargo build.
            exit /b 1
          )
          if not exist target\release\dmft_dll.dll (
            echo [fatal] target\release\dmft_dll.dll missing after cargo build.
            exit /b 1
          )
          echo [info] Release artifact check passed.

      - name: Package artifacts
        run: |
          if not exist release mkdir release
          copy /Y target\release\dmft.exe release\dmft.exe
          if exist target\release\dmft_dll.dll copy /Y target\release\dmft_dll.dll release\dmft_dll.dll
          > release\VERSION.txt <nul set /p =DMFT ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
