name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows release
    runs-on: [self-hosted, windows, X64, dmft]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Initialize reference submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: lukka/get-cmake@latest

      - name: Build release binaries
        run: cargo build --release
        env:
          LIBCLANG_PATH: "C:/Program Files/LLVM/lib"

      - name: Package artifacts
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item target/release/dmft.exe release/
          if (Test-Path target/release/dmft_dll.dll) {
            Copy-Item target/release/dmft_dll.dll release/
          }
          "DMFT ${{ github.ref_name }}" | Out-File -FilePath release/VERSION.txt -Encoding UTF8 -NoNewline

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
