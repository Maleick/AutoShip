name: Wiki Nightly

on:
  workflow_run:
    workflows: ["Nightly Release"]
    types: [completed]
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push wiki changes instead of running in dry-run validation mode"
        required: false
        default: false
        type: boolean
      source_sha:
        description: "Optional commit SHA to check out before syncing the wiki"
        required: false
        type: string

concurrency:
  group: wiki-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-wiki:
    name: Publish wiki snapshot
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64, textquest]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.source_sha || github.ref }}

      - name: Locate or provision verified Python
        env:
          PYTHON_EMBED_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          PYTHON_EMBED_SHA256: 4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3
        run: |
          where python >nul 2>nul && (
            echo PYTHON_CMD=python>>"%GITHUB_ENV%"
            python --version
            exit /b 0
          )
          where py >nul 2>nul && (
            echo PYTHON_CMD=py -3>>"%GITHUB_ENV%"
            py -3 --version
            exit /b 0
          )
          setlocal EnableDelayedExpansion
          if exist .ci-python rmdir /s /q .ci-python
          mkdir .ci-python
          curl.exe -fsSL -o .ci-python\python-embed.zip "%PYTHON_EMBED_URL%"
          for /f "tokens=* delims=" %%H in ('certutil -hashfile ".ci-python\python-embed.zip" SHA256 ^| findstr /r /v /c:"^SHA256" /c:"^CertUtil" /c:"^$"') do (
            set "PYTHON_EMBED_ACTUAL_SHA256=%%H"
          )
          set "PYTHON_EMBED_ACTUAL_SHA256=!PYTHON_EMBED_ACTUAL_SHA256: =!"
          if /I not "!PYTHON_EMBED_ACTUAL_SHA256!"=="%PYTHON_EMBED_SHA256%" (
            echo [fatal] Verified Python download checksum mismatch.
            echo [fatal] Expected: %PYTHON_EMBED_SHA256%
            echo [fatal] Actual:   !PYTHON_EMBED_ACTUAL_SHA256!
            exit /b 1
          )
          tar -xf .ci-python\python-embed.zip -C .ci-python
          if not exist .ci-python\python.exe (
            echo [fatal] Extracted python.exe not found after verified download.
            exit /b 1
          )
          endlocal & (
            echo PYTHON_CMD=%CD%\.ci-python\python.exe>>"%GITHUB_ENV%"
          )
          "%CD%\.ci-python\python.exe" --version

      - name: Validate wiki sources
        run: '%PYTHON_CMD% scripts/sync_wiki.py --check'

      - name: Publish wiki
        run: '%PYTHON_CMD% scripts/sync_wiki.py --push'
