name: Wiki Nightly

on:
  workflow_run:
    workflows: ["Nightly Release"]
    types: [completed]
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push wiki changes instead of running in dry-run validation mode"
        required: false
        default: false
        type: boolean
      source_sha:
        description: "Optional commit SHA to check out before syncing the wiki"
        required: false
        type: string

concurrency:
  group: wiki-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-wiki:
    name: Publish wiki snapshot
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64, dmft]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.source_sha || github.ref }}

      - name: Locate Python
        run: |
          where python >nul 2>nul && (echo PYTHON_CMD=python>>"%GITHUB_ENV%" & exit /b 0)
          where py >nul 2>nul && (echo PYTHON_CMD=py -3>>"%GITHUB_ENV%" & exit /b 0)
          if not exist .ci-python mkdir .ci-python
          set "PYTHON_EMBED_ZIP=.ci-python\python-embed.zip"
          set "PYTHON_EMBED_SHA256=4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3"
          curl.exe -fsSL -o "%PYTHON_EMBED_ZIP%" https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          for /f "tokens=1" %%i in ('certutil -hashfile "%PYTHON_EMBED_ZIP%" SHA256 ^| findstr /R /I "^[0-9A-F][0-9A-F]*$"') do set "DOWNLOADED_PYTHON_SHA256=%%i"
          if /I not "%DOWNLOADED_PYTHON_SHA256%"=="%PYTHON_EMBED_SHA256%" (
            echo [fatal] Python embed archive checksum mismatch.
            exit /b 1
          )
          tar -xf "%PYTHON_EMBED_ZIP%" -C .ci-python
          echo PYTHON_CMD=%CD%\.ci-python\python.exe>>"%GITHUB_ENV%"

      - name: Validate wiki sources
        run: '%PYTHON_CMD% scripts/sync_wiki.py --check'

      - name: Publish wiki
        run: '%PYTHON_CMD% scripts/sync_wiki.py --push'
