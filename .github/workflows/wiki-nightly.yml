name: Wiki Nightly

on:
  workflow_run:
    workflows: ["Nightly Release"]
    types: [completed]
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: wiki-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-wiki:
    name: Publish wiki snapshot
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64, dmft]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate wiki sources
        run: python scripts/sync_wiki.py --check

      - name: Publish wiki
        run: python scripts/sync_wiki.py --push
