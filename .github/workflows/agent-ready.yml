name: Auto-label agent-ready

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: "0 * * * *"

permissions:
  issues: write
  contents: read

jobs:
  ensure-agent-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure agent:ready label state
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const readyLabel = "agent:ready";
            const skipLabel = "agent:skip-ready";

            function shouldSkipFromEventLabels(labels) {
              const normalized = new Set((labels || []).map((label) => (label.name || "").toLowerCase()));
              return normalized.has(skipLabel);
            }

            async function ensureReadyState({ number, labels: currentLabels = [] }) {
              const normalized = new Set((currentLabels || []).map((label) => (label.name || "").toLowerCase()));
              const hasReady = normalized.has(readyLabel);
              const shouldSkip = shouldSkipFromEventLabels(currentLabels);

              if (shouldSkip && hasReady) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: number,
                  name: readyLabel,
                });
                return;
              }

              if (!shouldSkip && !hasReady) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: number,
                  labels: [readyLabel],
                });
              }
            }

            if (context.eventName === "issues") {
              await ensureReadyState(issue);
              return;
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            for (const openIssue of openIssues) {
              // Ignore pull requests.
              if (openIssue.pull_request) {
                continue;
              }
              await ensureReadyState(openIssue);
            }
