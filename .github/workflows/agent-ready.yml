name: Auto-label agent-ready

on:
  issues:
    types: [opened, closed, labeled, reopened]
  schedule:
    - cron: "0 * * * *"

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  ensure-agent-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure agent:ready label state
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const readyLabel = "agent:ready";
            const skipLabel = "agent:skip-ready";
            const requiredLabels = [
              {
                name: readyLabel,
                color: "0E8A16",
                description: "Issue is eligible for autonomous pickup.",
              },
              {
                name: skipLabel,
                color: "D93F0B",
                description: "Roadmap container issues are intentionally excluded from agent-ready.",
              },
            ];

            function isRoadmapContainerTitle(title) {
              return /^M(\d+|x)\b/i.test((title || "").trim());
            }

            function shouldSkipFromEventLabels(labels, title) {
              const normalized = new Set((labels || []).map((label) => (label.name || "").toLowerCase()));
              return normalized.has(skipLabel) || isRoadmapContainerTitle(title);
            }

            async function hasOpenLinkedPr(issueNumber) {
              let cursor = null;

              while (true) {
                const result = await github.graphql(
                  `
                    query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                      repository(owner: $owner, name: $repo) {
                        issue(number: $number) {
                          timelineItems(
                            first: 100
                            after: $cursor
                            itemTypes: [CONNECTED_EVENT, CROSS_REFERENCED_EVENT]
                          ) {
                            pageInfo {
                              hasNextPage
                              endCursor
                            }
                            nodes {
                              __typename
                              ... on ConnectedEvent {
                                subject {
                                  __typename
                                  ... on PullRequest {
                                    state
                                    repository {
                                      name
                                      owner {
                                        login
                                      }
                                    }
                                  }
                                }
                              }
                              ... on CrossReferencedEvent {
                                source {
                                  __typename
                                  ... on PullRequest {
                                    state
                                    repository {
                                      name
                                      owner {
                                        login
                                      }
                                    }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  `,
                  {
                    owner,
                    repo,
                    number: issueNumber,
                    cursor,
                  },
                );

                const timeline = result.repository.issue.timelineItems;
                for (const node of timeline.nodes) {
                  const pr = node.__typename === "ConnectedEvent" ? node.subject : node.source;
                  if (
                    pr?.__typename === "PullRequest" &&
                    pr.state === "OPEN" &&
                    pr.repository?.owner?.login === owner &&
                    pr.repository?.name === repo
                  ) {
                    return true;
                  }
                }

                if (!timeline.pageInfo.hasNextPage) {
                  return false;
                }
                cursor = timeline.pageInfo.endCursor;
              }
            }

            async function ensureLabel(definition) {
              try {
                await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: definition.name,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: definition.name,
                  color: definition.color,
                  description: definition.description,
                });
              }
            }

            async function ensureReadyState({ number, state = "open", title = "", labels: currentLabels = [] }) {
              const normalized = new Set((currentLabels || []).map((label) => (label.name || "").toLowerCase()));
              const hasReady = normalized.has(readyLabel);
              const shouldSkip = shouldSkipFromEventLabels(currentLabels, title);
              const isClosed = state !== "open";
              const shouldWithholdReady =
                normalized.has("agent:working") ||
                normalized.has("agent:blocked") ||
                (await hasOpenLinkedPr(number));

              if ((isClosed || shouldSkip || shouldWithholdReady) && hasReady) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: number,
                  name: readyLabel,
                });
                return;
              }

              if (!isClosed && !shouldSkip && !shouldWithholdReady && !hasReady) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: number,
                  labels: [readyLabel],
                });
              }
            }

            if (context.eventName === "issues") {
              for (const definition of requiredLabels) {
                await ensureLabel(definition);
              }
              await ensureReadyState(issue);
              return;
            }

            for (const definition of requiredLabels) {
              await ensureLabel(definition);
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            for (const openIssue of openIssues) {
              // Ignore pull requests.
              if (openIssue.pull_request) {
                continue;
              }
              await ensureReadyState(openIssue);
            }
