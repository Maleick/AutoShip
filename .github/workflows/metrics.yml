name: Refresh README Metrics

on:
  push:
    branches: [master]
    paths:
      - "**/*.rs"
      - "scripts/update_readme_metrics.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: [self-hosted, Linux, X64, textquest]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-metrics-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-metrics-

      - name: Run metrics update
        run: python3 scripts/update_readme_metrics.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/wiki/Project-Metrics.md
          if git diff --staged --quiet; then
            echo "No metrics change"
          else
            git commit -m "chore(docs): auto-refresh metrics [skip ci]"
            git push
          fi
