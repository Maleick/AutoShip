name: Refresh README Metrics

on:
  push:
    branches: [master]
  schedule:
    # Weekly self-healing fallback — ensures metrics refresh even if
    # push triggers are lost (runner outages, flood cancellations).
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-metrics:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip metrics]')
    runs-on: [self-hosted, Linux, X64, textquest]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-metrics-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-metrics-

      - name: Run metrics update
        run: python3 scripts/update_readme_metrics.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/wiki/Project-Metrics.md
          if git diff --staged --quiet; then
            echo "No metrics change"
          else
            git commit -m "chore(docs): auto-refresh metrics [skip ci] [skip metrics]"
            git push
          fi
