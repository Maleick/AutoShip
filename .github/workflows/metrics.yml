name: Refresh README Metrics

on:
  push:
    branches: [master]
  schedule:
    # Weekly self-healing fallback — ensures metrics refresh even if
    # push triggers are lost (runner outages, flood cancellations).
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-metrics:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip metrics]')
    runs-on: [self-hosted, Linux, X64, textquest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-metrics-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-metrics-

      - name: Run metrics update
        run: python3 scripts/update_readme_metrics.py

      - name: Report metrics drift
        run: |
          if git diff --quiet -- README.md docs/wiki/Project-Metrics.md; then
            echo "No metrics drift"
          else
            echo "::notice::README metrics are stale; update them in a normal PR."
            git diff -- README.md docs/wiki/Project-Metrics.md
          fi
