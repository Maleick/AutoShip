name: Auto-format

on:
  pull_request:
    branches: [master]

concurrency:
  group: fmt-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fmt:
    name: cargo fmt autofix
    # Only run for same-repo PRs (never forks — avoids running untrusted code
    # on self-hosted runners and we can't push back to fork branches anyway).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, textquest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          # Default GITHUB_TOKEN — has contents:write for same-repo branches.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust nightly + rustfmt
        run: |
          rustup toolchain install nightly --no-self-update
          rustup component add --toolchain nightly rustfmt

      - name: Run cargo fmt
        run: cargo +nightly fmt --all

      - name: Check for formatting changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No formatting changes needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Formatting changes detected:"
            git diff --stat
          fi

      - name: Commit and push formatting fix
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: cargo fmt --all (autofix)"
          git push
