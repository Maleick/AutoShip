name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_release_build:
        description: "Also run the Windows release build after the PR gate"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  pr_gate_untrusted:
    name: PR gate (fork PR path)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Configure Python command
        run: |
          echo PYTHON_CMD=python>>"%GITHUB_ENV%"
          python --version

      - name: Provision nightly toolchain via rustup
        env:
          NIGHTLY_TOOLCHAIN: nightly-x86_64-pc-windows-msvc
        run: |
          if not defined CARGO_HOME set "CARGO_HOME=%USERPROFILE%\.cargo"
          if not defined RUSTUP_HOME set "RUSTUP_HOME=%USERPROFILE%\.rustup"
          set "PATH=%CARGO_HOME%\bin;%PATH%"
          echo [info] Ensuring Rust toolchain %NIGHTLY_TOOLCHAIN% is available on this runner.
          where rustup.exe >nul 2>nul || (
            echo [warn] rustup.exe not found in PATH. Installing rustup bootstrap.
            curl.exe -fSLo "%TEMP%\rustup-init.exe" https://win.rustup.rs/x86_64
            start /wait "" "%TEMP%\rustup-init.exe" -y --no-modify-path --default-toolchain %NIGHTLY_TOOLCHAIN%
            if errorlevel 1 (
              echo [fatal] rustup bootstrap failed.
              exit /b 1
            )
            del /f /q "%TEMP%\rustup-init.exe"
          )
          where rustup.exe >nul 2>nul || (
            echo [fatal] rustup.exe still not available after bootstrap.
            exit /b 1
          )
          echo %CARGO_HOME%\bin>>%GITHUB_PATH%
          rustup --version
          rustup toolchain install %NIGHTLY_TOOLCHAIN% --no-self-update --force
          rustup default %NIGHTLY_TOOLCHAIN%
          rustup component add rustfmt clippy --toolchain %NIGHTLY_TOOLCHAIN%
          rustup run %NIGHTLY_TOOLCHAIN% rustc -V
          rustup run %NIGHTLY_TOOLCHAIN% rustc -V | findstr /i "nightly" >nul || (
            echo [fatal] rustc for %NIGHTLY_TOOLCHAIN% is not reporting a nightly compiler.
            exit /b 1
          )
          echo [info] Nightly compiler confirmed for %NIGHTLY_TOOLCHAIN%.

      - uses: lukka/get-cmake@v4.3.1
      - run: "%PYTHON_CMD% scripts/sync_wiki.py --check"
      - run: "%PYTHON_CMD% -m unittest discover -s tests -p test_*.py -v"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  pr_gate_trusted:
    name: PR gate (trusted path)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5

      - name: Configure Git safe directories
        run: |
          setlocal EnableDelayedExpansion
          echo [info] Marking workflow directories as trusted for Git.
          if "%GITHUB_WORKSPACE%"=="" (
            echo [warn] GITHUB_WORKSPACE is not defined. Falling back to %CD%.
            set "GITHUB_WORKSPACE=%CD%"
          )
          echo [info] Using GITHUB_WORKSPACE as "!GITHUB_WORKSPACE!"
          for %%D in ("!GITHUB_WORKSPACE!") do (
            git config --global --add safe.directory "%%~D" || (
              echo [fatal] Unable to add safe.directory for %%~D.
              exit /b 1
            )
          )
          echo [info] Active safe.directory values:
          git config --global --get-all safe.directory

      - name: Setup verified Python
        uses: ./.github/actions/setup-verified-python

      - name: Provision nightly toolchain via rustup
        env:
          NIGHTLY_TOOLCHAIN: nightly-x86_64-pc-windows-msvc
        run: |
          if not defined CARGO_HOME set "CARGO_HOME=%USERPROFILE%\.cargo"
          if not defined RUSTUP_HOME set "RUSTUP_HOME=%USERPROFILE%\.rustup"
          set "PATH=%CARGO_HOME%\bin;%PATH%"
          echo [info] Ensuring Rust toolchain %NIGHTLY_TOOLCHAIN% is available on this runner.
          where rustup.exe >nul 2>nul || (
            echo [warn] rustup.exe not found in PATH. Installing rustup bootstrap.
            curl.exe -fSLo "%TEMP%\rustup-init.exe" https://win.rustup.rs/x86_64
            start /wait "" "%TEMP%\rustup-init.exe" -y --no-modify-path --default-toolchain %NIGHTLY_TOOLCHAIN%
            if errorlevel 1 (
              echo [fatal] rustup bootstrap failed.
              exit /b 1
            )
            del /f /q "%TEMP%\rustup-init.exe"
          )
          where rustup.exe >nul 2>nul || (
            echo [fatal] rustup.exe still not available after bootstrap.
            exit /b 1
          )
          echo %CARGO_HOME%\bin>>%GITHUB_PATH%
          rustup --version
          rustup show
          rustup toolchain install %NIGHTLY_TOOLCHAIN% --no-self-update --force
          rustup default %NIGHTLY_TOOLCHAIN%
          rustup component add rustfmt clippy --toolchain %NIGHTLY_TOOLCHAIN%
          rustup run %NIGHTLY_TOOLCHAIN% rustc -V
          rustup run %NIGHTLY_TOOLCHAIN% rustc -V | findstr /i "nightly" >nul || (
            echo [fatal] rustc for %NIGHTLY_TOOLCHAIN% is not reporting a nightly compiler.
            exit /b 1
          )
          echo [info] Nightly compiler confirmed for %NIGHTLY_TOOLCHAIN%.

      - name: Ensure cmake on PATH
        uses: ./.github/actions/ensure-cmake
      - run: "%PYTHON_CMD% scripts/sync_wiki.py --check"
      - run: "%PYTHON_CMD% -m unittest discover -s tests -p test_*.py -v"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test -- --nocapture

  pr_gate:
    name: PR gate (fmt + clippy + test + python)
    if: always()
    needs: [pr_gate_untrusted, pr_gate_trusted]
    runs-on: ubuntu-latest
    steps:
      - name: Validate runner-specific gate result
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || '' }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_RESULT: ${{ needs.pr_gate_trusted.result }}
          UNTRUSTED_RESULT: ${{ needs.pr_gate_untrusted.result }}
        run: |
          set -euo pipefail

          expected="trusted"
          result="$TRUSTED_RESULT"
          other_label="untrusted"
          other_result="$UNTRUSTED_RESULT"

          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" != "$REPOSITORY" ]]; then
            expected="untrusted"
            result="$UNTRUSTED_RESULT"
            other_label="trusted"
            other_result="$TRUSTED_RESULT"
          fi

          echo "Expected gate path: $expected"
          echo "Trusted result: $TRUSTED_RESULT"
          echo "Untrusted result: $UNTRUSTED_RESULT"

          if [[ "$result" != "success" ]]; then
            echo "::error::Expected the $expected PR gate path to succeed, got '$result'."
            exit 1
          fi

          case "$other_result" in
            skipped|success)
              ;;
            *)
              echo "::error::Unexpected $other_label PR gate result '$other_result'."
              exit 1
              ;;
          esac

  secrets_scan:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@6bd2d14f7a4bc1e569fa3550efa7ec632a4fa67b # v3.94.2
        with:
          extra_args: --only-verified

  windows:
    name: Windows release build (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_release_build
    needs: pr_gate_trusted
    runs-on: [self-hosted, Windows, X64, textquest]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5

      - name: Configure Git safe directories for runner account
        run: |
          setlocal EnableDelayedExpansion
          echo [info] Marking workflow directories as trusted for Git.
          if "%GITHUB_WORKSPACE%"=="" (
            echo [warn] GITHUB_WORKSPACE is not defined. Falling back to %CD%.
            set "GITHUB_WORKSPACE=%CD%"
          )
          echo [info] Using GITHUB_WORKSPACE as "!GITHUB_WORKSPACE!"
          for %%D in ("!GITHUB_WORKSPACE!" "C:\actions-runner\_work\TextQuest\TextQuest" "C:\actions-runner\_work\TextQuest") do (
            git config --global --add safe.directory "%%~D" || (
              echo [fatal] Unable to add safe.directory for %%~D.
              exit /b 1
            )
          )
          echo [info] Active safe.directory values:
          git config --global --get-all safe.directory

      - name: Reclaim leaked browser processes on self-hosted runner
        shell: pwsh
        run: |
          $browserNames = @("chrome", "msedge", "chromium")
          $browserProcesses = @(Get-Process -Name $browserNames -ErrorAction SilentlyContinue)
          if ($browserProcesses.Count -gt 0) {
            Write-Warning ("Stopping {0} leaked browser process(es) before the manual Windows build." -f $browserProcesses.Count)
            $browserProcesses | Stop-Process -Force
          } else {
            Write-Host "No leaked Chrome/Edge/Chromium processes detected before the manual Windows build."
          }
          $os = Get-CimInstance Win32_OperatingSystem
          $freeGiB = [math]::Round(($os.FreePhysicalMemory * 1KB) / 1GB, 2)
          $totalGiB = [math]::Round(($os.TotalVisibleMemorySize * 1KB) / 1GB, 2)
          Write-Host ("Available physical memory before build: {0} GiB / {1} GiB" -f $freeGiB, $totalGiB)

      - name: Provision nightly toolchain via rustup
        env:
          NIGHTLY_TOOLCHAIN: nightly-x86_64-pc-windows-msvc
        run: |
          if not defined CARGO_HOME set "CARGO_HOME=%USERPROFILE%\.cargo"
          if not defined RUSTUP_HOME set "RUSTUP_HOME=%USERPROFILE%\.rustup"
          set "PATH=%CARGO_HOME%\bin;%PATH%"
          echo [info] Ensuring Rust toolchain %NIGHTLY_TOOLCHAIN% is available on this runner.
          where rustup.exe >nul 2>nul || (
            echo [warn] rustup.exe not found in PATH. Installing rustup bootstrap.
            curl.exe -fSLo "%TEMP%\rustup-init.exe" https://win.rustup.rs/x86_64
            start /wait "" "%TEMP%\rustup-init.exe" -y --no-modify-path --default-toolchain %NIGHTLY_TOOLCHAIN%
            if errorlevel 1 (
              echo [fatal] rustup bootstrap failed.
              exit /b 1
            )
            del /f /q "%TEMP%\rustup-init.exe"
          )
          where rustup.exe >nul 2>nul || (
            echo [fatal] rustup.exe still not available after bootstrap.
            exit /b 1
          )
          echo %CARGO_HOME%\bin>>%GITHUB_PATH%
          echo [info] rustup version:
          rustup --version
          rustup show
          rustup toolchain install %NIGHTLY_TOOLCHAIN% --no-self-update --force
          rustup default %NIGHTLY_TOOLCHAIN%
          rustup component add rustfmt clippy --toolchain %NIGHTLY_TOOLCHAIN%
          rustup run %NIGHTLY_TOOLCHAIN% rustc -V | findstr /i "nightly" >nul || (
            echo [fatal] rustc for %NIGHTLY_TOOLCHAIN% is not reporting a nightly compiler.
            exit /b 1
          )

      - name: Ensure cmake on PATH
        uses: ./.github/actions/ensure-cmake

      - name: Nightly compiler sanity check
        run: |
          echo [info] Verifying required nightly compiler for release path.
          rustc -V
          rustc -V | findstr /i "nightly" >nul
          if errorlevel 1 (
            echo [fatal] Release workflow requires nightly toolchain but rustc is not reporting nightly.
            exit /b 1
          )
          cargo --version

      - run: cargo build --release
        env:
          LIBCLANG_PATH: "C:/Program Files/LLVM/lib"
