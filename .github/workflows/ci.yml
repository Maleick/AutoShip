name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate_maps:
    name: Validate map files
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, Linux, X64, textquest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate Brewall map format
        shell: bash
        run: |
          set +e
          python3 scripts/validate-maps.py config/maps | tee validate-maps.log
          status=${PIPESTATUS[0]}

          {
            echo "## Map validation"
            echo
            echo '```text'
            cat validate-maps.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

  pr_gate:
    name: PR gate (fmt + clippy) on Linux
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, Linux, X64, textquest]
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci-target/${{ github.run_id }}/pr-gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only change set
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Unsupported event for diff scoping; running full gate."
            exit 0
          fi

          if ! diff_output="$(git diff --name-only "$base" "$head")"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Failed to diff $base..$head; running full gate."
            exit 0
          fi

          mapfile -t changed_files < <(printf '%s\n' "$diff_output")

          if [[ ${#changed_files[@]} -eq 0 ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No changed files detected; running full gate."
            exit 0
          fi

          echo "Changed files:"
          printf '  %s\n' "${changed_files[@]}"

          docs_only=true
          for file in "${changed_files[@]}"; do
            case "$file" in
              docs/**|site/**|*.md|requirements-docs.txt|.github/workflows/docs-pages.yml|tests/test_*docs*.py|tests/test_workflow_contract.py)
                ;;
              *)
                docs_only=false
                echo "Non-doc change detected: $file"
                break
                ;;
            esac
          done

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

      - name: Install native build dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          sudo flock /tmp/textquest-apt.lock bash -c '
            set -euo pipefail
            apt-get -o DPkg::Lock::Timeout=300 update
            apt-get -o DPkg::Lock::Timeout=300 install -y cmake clang libclang-dev llvm-dev pkg-config libssl-dev libasound2-dev
          '
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Setup Python
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 -m pip install PyYAML==6.0.3

      - name: Setup Rust
        if: steps.scope.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        if: steps.scope.outputs.docs_only != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Check Rust formatting
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo fmt --all -- --check

      - name: Validate wiki sources
        run: python3 scripts/sync_wiki.py --check

      - name: Enforce wiki update for behavior changes
        if: steps.scope.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "Wiki enforcement only runs on PRs; skipping."
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          changed_files=$(git diff --name-only "$base" "$head")

          # Source files that require operator-facing docs
          source_files=$(echo "$changed_files" | grep -vE '^docs/wiki/|^tests/|\.md$|\.yml$|\.yaml$' || true)

          if [[ -z "$source_files" ]]; then
            echo "No source files changed; wiki enforcement passed."
            exit 0
          fi

          wiki_updated=$(echo "$changed_files" | grep -q '^docs/wiki/' && echo "yes" || echo "no")

          if [[ "$wiki_updated" == "no" ]]; then
            echo "::error::Source files changed but no docs/wiki/ update detected."
            echo "::error::When behavior or operator workflow changes, update the matching docs/wiki/ page."
            echo "Changed source files:"
            echo "$source_files"
            exit 1
          fi

          echo "Wiki update detected alongside source changes."
          echo "$changed_files" | grep '^docs/wiki/'

      - name: Validate offset sync
        run: python3 scripts/validate_offsets_sync.py

      - name: Run Python tests (advisory)
        if: steps.scope.outputs.docs_only != 'true'
        continue-on-error: true
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run clippy
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

  coverage:
    name: Coverage (tarpaulin) on Linux
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, Linux, X64, textquest]
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci-target/${{ github.run_id }}/coverage
      COVERAGE_THRESHOLD: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only change set
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Unsupported event for diff scoping; running full coverage."
            exit 0
          fi

          if ! diff_output="$(git diff --name-only "$base" "$head")"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Failed to diff $base..$head; running full coverage."
            exit 0
          fi

          mapfile -t changed_files < <(printf '%s\n' "$diff_output")

          if [[ ${#changed_files[@]} -eq 0 ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          for file in "${changed_files[@]}"; do
            case "$file" in
              docs/**|site/**|*.md|requirements-docs.txt|.github/workflows/docs-pages.yml|tests/test_*docs*.py|tests/test_workflow_contract.py)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: Install native build dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          sudo flock /tmp/textquest-apt.lock bash -c '
            set -euo pipefail
            apt-get -o DPkg::Lock::Timeout=300 update
            apt-get -o DPkg::Lock::Timeout=300 install -y cmake clang libclang-dev llvm-dev pkg-config libssl-dev libasound2-dev
          '
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Setup Python
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 -m pip install PyYAML==6.0.3

      - name: Setup Rust
        if: steps.scope.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        if: steps.scope.outputs.docs_only != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install cargo-tarpaulin
        if: steps.scope.outputs.docs_only != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin@0.35.2

      - name: Run coverage (threshold 80%)
        if: steps.scope.outputs.docs_only != 'true'
        env:
          CARGO_BUILD_JOBS: "1"
        run: python3 scripts/coverage-report.py --threshold "${COVERAGE_THRESHOLD}" --html --xml

      - name: Stage coverage artifacts
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          mkdir -p target/coverage-reports
          html_report="$(find target -type f -name 'tarpaulin-report.html' | head -n 1 || true)"
          xml_report="$(find target -type f \( -name 'cobertura.xml' -o -name 'tarpaulin-report.xml' \) | head -n 1 || true)"

          if [ -n "$html_report" ]; then
            cp "$html_report" target/coverage-reports/coverage-report.html
          fi
          if [ -n "$xml_report" ]; then
            cp "$xml_report" target/coverage-reports/coverage-report.xml
          fi

          if [ ! -f target/coverage-reports/coverage-report.html ] || [ ! -f target/coverage-reports/coverage-report.xml ]; then
            echo "::warning::Expected coverage artifacts were not generated."
          fi

      - name: Upload coverage reports
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ github.sha }}
          path: target/coverage-reports/**
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: steps.scope.outputs.docs_only != 'true'
        uses: codecov/codecov-action@v4
        with:
          files: target/coverage-reports/coverage-report.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  test-matrix:
    name: Unit tests on ${{ matrix.os-name }} (rust-${{ matrix.rust }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows with stable Rust (primary target)
          - runner: [self-hosted, Windows, X64, textquest]
            os-name: windows
            rust: stable
            test-command: cargo test -p textquest-web-sdk --lib
          # Windows with nightly Rust (for unsafe hooks testing)
          - runner: [self-hosted, Windows, X64, textquest]
            os-name: windows
            rust: nightly
            continue-on-error: true
            test-command: cargo test -p textquest-dll --lib --all-features
          # Linux with stable Rust
          - runner: [self-hosted, Linux, X64, textquest]
            os-name: linux
            rust: stable
            test-command: cargo test --lib --all-features
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci-target/${{ github.run_id }}/test-${{ matrix.os-name }}-${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-rust-toolchain-windows
        with:
          toolchain: ${{ matrix.rust == 'nightly' && 'nightly-x86_64-pc-windows-msvc' || 'stable-x86_64-pc-windows-msvc' }}
          components: clippy

      - name: Setup Rust (Linux)
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Install Linux dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo flock /tmp/textquest-apt.lock bash -c '
            set -euo pipefail
            apt-get -o DPkg::Lock::Timeout=300 update
            apt-get -o DPkg::Lock::Timeout=300 install -y cmake clang libclang-dev llvm-dev pkg-config libssl-dev libasound2-dev
          '
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Run unit tests
        continue-on-error: ${{ matrix.continue-on-error == true }}
        run: ${{ matrix.test-command }}

  secrets_scan:
    name: Secret scan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, Linux, X64, textquest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@6bd2d14f7a4bc1e569fa3550efa7ec632a4fa67b
        with:
          extra_args: --only-verified

  advisory_checks:
    name: Advisory dependency checks (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, textquest]
    timeout-minutes: 15
    continue-on-error: true
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci-target/${{ github.run_id }}/advisory
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo audit
        run: cargo audit --deny warnings

      - name: Run cargo deny
        run: cargo deny check
