name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - README.md
      - docs/**
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  submodules:
    name: Reference submodules + wiki check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize reference submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
      - name: Verify reference trees
        run: |
          git submodule status --recursive
          test -f third_party/eqlib/include/eqlib/offsets/eqgame.h
          test -d third_party/macroquest/src/login
          test -d third_party/macroquest/src/routing
          test -d third_party/macroquest/src/eqlib
      - name: Check wiki structure
        run: python3 scripts/sync_wiki.py --check

  windows:
    name: Windows (fmt + clippy + test + build)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: lukka/get-cmake@latest
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          LIBCLANG_PATH: "C:/Program Files/LLVM/lib"
      - run: cargo test
        env:
          LIBCLANG_PATH: "C:/Program Files/LLVM/lib"
      - run: cargo build --release
        env:
          LIBCLANG_PATH: "C:/Program Files/LLVM/lib"
