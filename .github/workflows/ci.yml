name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, reopened, ready_for_review]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  submodules:
    name: Reference submodules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize reference submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
      - name: Verify reference trees
        run: |
          git submodule status --recursive
          test -f third_party/eqlib/include/eqlib/offsets/eqgame.h
          test -d third_party/macroquest/src/login
          test -d third_party/macroquest/src/routing
          test -d third_party/macroquest/src/eqlib

  macos:
    name: macOS (fmt + clippy + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync_wiki.py --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  windows:
    name: Windows (build only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
      - uses: lukka/get-cmake@latest
      - run: cargo build --release
        env:
          LIBCLANG_PATH: "C:/Program Files/LLVM/lib"
