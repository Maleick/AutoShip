name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_release_build:
        description: "Also run the Windows release build after the PR gate"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  pr_gate_untrusted:
    name: PR gate (fork PR path)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5

      - name: Setup verified Python
        uses: ./.github/actions/setup-verified-python

      - name: Setup Rust nightly
        uses: ./.github/actions/setup-rust-nightly

      - name: Ensure cmake on PATH
        uses: ./.github/actions/ensure-cmake
      - run: "%PYTHON_CMD% scripts/sync_wiki.py --check"
      - run: "%PYTHON_CMD% -m unittest discover -s tests -p test_*.py -v"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  pr_gate_trusted:
    name: PR gate (trusted path)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, X64, textquest]
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5

      - name: Configure Git safe directories
        uses: ./.github/actions/configure-safe-directory

      - name: Setup verified Python
        uses: ./.github/actions/setup-verified-python

      - name: Setup Rust nightly
        uses: ./.github/actions/setup-rust-nightly

      - name: Ensure cmake on PATH
        uses: ./.github/actions/ensure-cmake
      - run: "%PYTHON_CMD% scripts/sync_wiki.py --check"
      - run: "%PYTHON_CMD% -m unittest discover -s tests -p test_*.py -v"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test -- --nocapture

  pr_gate:
    name: PR gate (fmt + clippy + test + python)
    if: github.event_name != 'push'
    runs-on: [self-hosted, Linux, X64, textquest]
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for runner-specific gate result
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const isForkPr =
              context.eventName === "pull_request" &&
              context.payload.pull_request.head.repo.full_name !== `${owner}/${repo}`;
            const targetJobName = isForkPr
              ? "PR gate (fork PR path)"
              : "PR gate (trusted path)";
            const otherJobName = isForkPr
              ? "PR gate (trusted path)"
              : "PR gate (fork PR path)";

            // listJobsForWorkflowRunAttempt requires attempt_number and returns 404 in some
            // PR contexts (e.g. when context.runAttempt is unavailable).  Fall back to
            // listJobsForWorkflowRun, which is always available, to avoid hard failures.
            async function listJobs() {
              if (context.runAttempt) {
                try {
                  return await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                    owner,
                    repo,
                    run_id: context.runId,
                    attempt_number: context.runAttempt,
                    per_page: 100,
                  });
                } catch (e) {
                  core.warning(
                    `listJobsForWorkflowRunAttempt failed (${e.status ?? "unknown"}); ` +
                    `falling back to listJobsForWorkflowRun`
                  );
                }
              }
              return await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: context.runId,
                per_page: 100,
              });
            }

            for (let attempt = 1; attempt <= 180; attempt += 1) {
              const jobs = await listJobs();

              const target = jobs.find((job) => job.name === targetJobName);
              const other = jobs.find((job) => job.name === otherJobName);
              core.info(
                `Attempt ${attempt}: ${targetJobName}=${target?.status ?? "missing"}/${target?.conclusion ?? "n/a"}, ` +
                `${otherJobName}=${other?.status ?? "missing"}/${other?.conclusion ?? "n/a"}`
              );

              if (
                other &&
                other.status === "completed" &&
                other.conclusion &&
                other.conclusion !== "skipped"
              ) {
                core.setFailed(`Unexpected ${otherJobName} result: ${other.conclusion}`);
                return;
              }

              if (!target || target.status !== "completed") {
                await new Promise((resolve) => setTimeout(resolve, 10000));
                continue;
              }

              if (target.conclusion !== "success") {
                core.setFailed(`${targetJobName} concluded with ${target.conclusion}`);
                return;
              }

              core.info(`${targetJobName} succeeded; merge gate satisfied.`);
              return;
            }

            core.setFailed(`Timed out waiting for ${targetJobName} to finish.`);

  secrets_scan:
    name: Secret scan (TruffleHog)
    runs-on: [self-hosted, Linux, X64, textquest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@6bd2d14f7a4bc1e569fa3550efa7ec632a4fa67b # v3.94.2
        with:
          extra_args: --only-verified

  windows:
    name: Windows release build (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_release_build
    needs: pr_gate
    runs-on: [self-hosted, Windows, X64, textquest]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5

      - name: Configure Git safe directories
        uses: ./.github/actions/configure-safe-directory

      - name: Reclaim leaked browser processes on self-hosted runner
        shell: pwsh
        run: |
          $browserNames = @("chrome", "msedge", "chromium")
          $browserProcesses = @(Get-Process -Name $browserNames -ErrorAction SilentlyContinue)
          if ($browserProcesses.Count -gt 0) {
            Write-Warning ("Stopping {0} leaked browser process(es) before the manual Windows build." -f $browserProcesses.Count)
            $browserProcesses | Stop-Process -Force
          } else {
            Write-Host "No leaked Chrome/Edge/Chromium processes detected before the manual Windows build."
          }
          $os = Get-CimInstance Win32_OperatingSystem
          $freeGiB = [math]::Round(($os.FreePhysicalMemory * 1KB) / 1GB, 2)
          $totalGiB = [math]::Round(($os.TotalVisibleMemorySize * 1KB) / 1GB, 2)
          Write-Host ("Available physical memory before build: {0} GiB / {1} GiB" -f $freeGiB, $totalGiB)

      - name: Setup Rust nightly
        uses: ./.github/actions/setup-rust-nightly

      - name: Ensure cmake on PATH
        uses: ./.github/actions/ensure-cmake

      - run: cargo build --release
        env:
          LIBCLANG_PATH: "C:/Program Files/LLVM/lib"
