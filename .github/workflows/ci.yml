name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - README.md
      - docs/**
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  submodules:
    name: Reference submodules
    runs-on: [self-hosted, windows, X64, dmft]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Initialize reference submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
      - name: Verify reference trees
        run: |
          git submodule status --recursive
          if (-not (Test-Path "third_party/eqlib/include/eqlib/offsets/eqgame.h")) { throw "missing third_party/eqlib/include/eqlib/offsets/eqgame.h" }
          if (-not (Test-Path "third_party/macroquest/src/login")) { throw "missing third_party/macroquest/src/login" }
          if (-not (Test-Path "third_party/macroquest/src/routing")) { throw "missing third_party/macroquest/src/routing" }
          if (-not (Test-Path "third_party/macroquest/src/eqlib")) { throw "missing third_party/macroquest/src/eqlib" }

  ubuntu:
    name: Windows (fmt + clippy + test)
    runs-on: [self-hosted, windows, X64, dmft]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/sync_wiki.py --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  windows:
    name: Windows (build only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, X64, dmft]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
      - uses: lukka/get-cmake@latest
      - run: cargo build --release
        env:
          LIBCLANG_PATH: "C:/Program Files/LLVM/lib"
