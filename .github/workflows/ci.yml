name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - README.md
      - docs/**
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  submodules:
    name: Reference submodules
    runs-on: [self-hosted, Windows, X64, dmft]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Initialize reference submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
      - name: Verify reference trees
        run: |
          git submodule status --recursive
          test -f third_party/eqlib/include/eqlib/offsets/eqgame.h || { echo "missing third_party/eqlib/include/eqlib/offsets/eqgame.h"; exit 1; }
          test -d third_party/macroquest/src/login || { echo "missing third_party/macroquest/src/login"; exit 1; }
          test -d third_party/macroquest/src/routing || { echo "missing third_party/macroquest/src/routing"; exit 1; }
          test -d third_party/macroquest/src/eqlib || { echo "missing third_party/macroquest/src/eqlib"; exit 1; }

  windows_checks:
    name: Windows checks (fmt + clippy + test)
    runs-on: [self-hosted, Windows, X64, dmft]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Locate Python
        run: |
          if command -v python >/dev/null 2>&1; then
            echo "PYTHON_CMD=python" >> "$GITHUB_ENV"
            exit 0
          fi
          if command -v py >/dev/null 2>&1; then
            echo "PYTHON_CMD=py -3" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p .ci-python
          curl -fsSL -o .ci-python/python-embed.zip https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          tar -xf .ci-python/python-embed.zip -C .ci-python
          echo "PYTHON_CMD=$PWD/.ci-python/python.exe" >> "$GITHUB_ENV"
      - run: eval "$PYTHON_CMD scripts/sync_wiki.py --check"
      - run: eval "$PYTHON_CMD -m unittest discover -s tests -p 'test_*.py' -v"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  windows:
    name: Windows release build
    if: github.event_name == 'workflow_dispatch'
    needs: submodules
    runs-on: [self-hosted, Windows, X64, dmft]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Initialize reference submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: lukka/get-cmake@v4
      - run: cargo build --release
        env:
          LIBCLANG_PATH: "C:/Program Files/LLVM/lib"
