name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  merge_gate:
    name: PR gate (fmt + clippy + coverage) on Linux
    runs-on: [self-hosted, Linux, X64, textquest]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only change set
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Unsupported event for diff scoping; running full gate."
            exit 0
          fi

          if ! diff_output="$(git diff --name-only "$base" "$head")"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Failed to diff $base..$head; running full gate."
            exit 0
          fi

          mapfile -t changed_files < <(printf '%s\n' "$diff_output")

          if [[ ${#changed_files[@]} -eq 0 ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No changed files detected; running full gate."
            exit 0
          fi

          echo "Changed files:"
          printf '  %s\n' "${changed_files[@]}"

          docs_only=true
          for file in "${changed_files[@]}"; do
            case "$file" in
              docs/**|site/**|*.md|*.txt|.github/workflows/ci.yml|.github/workflows/docs-pages.yml|tests/test_*docs*.py|tests/test_workflow_contract.py)
                ;;
              *)
                docs_only=false
                echo "Non-doc change detected: $file"
                break
                ;;
            esac
          done

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

      - name: Install native build dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev pkg-config libssl-dev libasound2-dev
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Setup Python
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        if: steps.scope.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        if: steps.scope.outputs.docs_only != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo fmt --all -- --check

      - name: Validate wiki sources
        run: python3 scripts/sync_wiki.py --check

      - name: Enforce wiki update for behavior changes
        if: steps.scope.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "Wiki enforcement only runs on PRs; skipping."
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          changed_files=$(git diff --name-only "$base" "$head")

          # Source files that require operator-facing docs
          source_files=$(echo "$changed_files" | grep -vE '^docs/wiki/|^tests/|\.md$|\.yml$|\.yaml$' || true)

          if [[ -z "$source_files" ]]; then
            echo "No source files changed; wiki enforcement passed."
            exit 0
          fi

          wiki_updated=$(echo "$changed_files" | grep -q '^docs/wiki/' && echo "yes" || echo "no")

          if [[ "$wiki_updated" == "no" ]]; then
            echo "::error::Source files changed but no docs/wiki/ update detected."
            echo "::error::When behavior or operator workflow changes, update the matching docs/wiki/ page."
            echo "Changed source files:"
            echo "$source_files"
            exit 1
          fi

          echo "Wiki update detected alongside source changes."
          echo "$changed_files" | grep '^docs/wiki/'

      - name: Validate offset sync
        run: python3 scripts/validate_offsets_sync.py

      - name: Run Python tests (advisory)
        if: steps.scope.outputs.docs_only != 'true'
        continue-on-error: true
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check rustfmt
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo fmt --check
      - name: Run clippy
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cache cargo-tarpaulin binary
        if: steps.scope.outputs.docs_only != 'true'
        id: cache-tarpaulin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: cargo-tarpaulin-${{ runner.os }}-v0.31

      - name: Install cargo-tarpaulin
        if: steps.scope.outputs.docs_only != 'true' && steps.cache-tarpaulin.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin --locked --version ^0.31

      - name: Run coverage (threshold 80%)
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 scripts/coverage-report.py --threshold 80

  test-matrix:
    name: Unit tests on ${{ matrix.os-name }} (rust-${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows with stable Rust (primary target)
          - runner: '["self-hosted", "Windows", "X64", "textquest"]'
            os-name: windows
            rust: stable
          # Windows with nightly Rust (for unsafe hooks testing)
          - runner: '["self-hosted", "Windows", "X64", "textquest"]'
            os-name: windows
            rust: nightly
          # Linux with stable Rust
          - runner: '["self-hosted", "Linux", "X64", "textquest"]'
            os-name: linux
            rust: stable
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Install Linux dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev pkg-config libssl-dev libasound2-dev
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --lib --all-features

  secrets_scan:
    name: Secret scan
    runs-on: [self-hosted, Linux, X64, textquest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@6bd2d14f7a4bc1e569fa3550efa7ec632a4fa67b
        with:
          extra_args: --only-verified

  advisory_checks:
    name: Advisory dependency checks (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, textquest]
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo audit
        run: cargo audit --deny warnings

      - name: Run cargo deny
        run: cargo deny check
