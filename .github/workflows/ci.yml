name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - README.md
      - docs/**
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  submodules:
    name: Reference submodules
    runs-on: [self-hosted, Windows, X64, dmft]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Initialize reference submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
      - name: Verify reference trees
        run: |
          git submodule status --recursive
          if (-not (Test-Path "third_party/eqlib/include/eqlib/offsets/eqgame.h")) { throw "missing third_party/eqlib/include/eqlib/offsets/eqgame.h" }
          if (-not (Test-Path "third_party/macroquest/src/login")) { throw "missing third_party/macroquest/src/login" }
          if (-not (Test-Path "third_party/macroquest/src/routing")) { throw "missing third_party/macroquest/src/routing" }
          if (-not (Test-Path "third_party/macroquest/src/eqlib")) { throw "missing third_party/macroquest/src/eqlib" }

  windows_checks:
    name: Windows checks (fmt + clippy + test)
    runs-on: [self-hosted, Windows, X64, dmft]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Locate Python
        run: |
          $python = (Get-Command python -ErrorAction SilentlyContinue)
          if ($python) {
            "PYTHON_CMD=python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }

          $py = (Get-Command py -ErrorAction SilentlyContinue)
          if ($py) {
            "PYTHON_CMD=py -3" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }

          throw "Python 3 is not installed on the Windows runner."
      - run: |
          Invoke-Expression "$env:PYTHON_CMD scripts/sync_wiki.py --check"
      - run: |
          Invoke-Expression "$env:PYTHON_CMD -m unittest discover -s tests -p 'test_*.py' -v"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  windows:
    name: Windows release build
    if: github.event_name == 'workflow_dispatch'
    needs: submodules
    runs-on: [self-hosted, Windows, X64, dmft]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Initialize reference submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: lukka/get-cmake@v4
      - run: cargo build --release
        env:
          LIBCLANG_PATH: "C:/Program Files/LLVM/lib"
