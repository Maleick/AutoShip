name: Lint & Type Check

on:
  push:
    branches:
      - master
      - main
    paths:
      - "textquest-web/frontend/**"
      - ".github/workflows/lint.yml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "textquest-web/frontend/**"

jobs:
  lint:
    name: ESLint & TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "textquest-web/frontend/package-lock.json"

      - name: Install dependencies
        working-directory: textquest-web/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: textquest-web/frontend
        run: npm run lint

      - name: Check TypeScript compilation
        working-directory: textquest-web/frontend
        run: npm run build

  format:
    name: Prettier Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "textquest-web/frontend/package-lock.json"

      - name: Install dependencies
        working-directory: textquest-web/frontend
        run: npm ci

      - name: Check Prettier formatting
        working-directory: textquest-web/frontend
        run: npm run format:check
